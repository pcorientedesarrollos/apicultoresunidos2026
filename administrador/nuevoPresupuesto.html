<section class="content">
    <div class="row">
        <div class="col-lg-8 col-lg-offset-2">
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px;">
                    <h5 class="encabezadosTabla">
                        PRESUPUESTOS DEL MES DE {{mes|uppercase}}
                        <a title="Regresar" href="#/presupuestosCuentas"
                            class="btn btn-success btn-xs" style="float: right">
                            <i class="zmdi red zmdi-undo"></i>
                        </a>
                    </h5>
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="table-responsive no-padding">
                                <table ng-repeat="pre in presupuestosAsignados "
                                    class="table table-condensed table-bordered">
                                    <thead>
                                        <tr>
                                            <th colspan="2">{{pre.cuenta}}</th>
                                            <!-- <th></th> -->
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr ng-repeat="presu in pre.subcuentas">
                                            <td>{{presu.subcuenta}}</td>
                                            <td style="width: 35%;">
                                                <input type="text" class="form-control form-sm text-right"
                                                    ng-model="presu.cantidad">
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-lg-4 pull-right">
                            <button ng-click="guardarPresupuestos()">Guardar</button>
                        </div>
                    </div>
                </div>
            </div>
</section>
<div growl>

</div>
