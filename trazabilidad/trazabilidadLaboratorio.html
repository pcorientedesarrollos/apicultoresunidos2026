<section class="content">
    <div class="row">
        <div class="col-lg-8 col-lg-offset-1">
            <div class="box-tools col s4 visible-lg visible-md hidden-sm hidden-xs" style="float: right">
                <div class="input-group" style="width: 300px;">
                    <input type="text" ng-model="filtroTrazabilidadLab" class="form-control input-sm pull-right" placeholder="Ingrese lo que desea buscar">
                    <div class="input-group-btn">
                        <button class="btn btn-sm btn-warning">
                            <i class="zmdi zmdi-search"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="box-tools col-sm-4 col-xs-4 visible-xs visible-sm hidden-md hidden-lg">
                <div class="input-group" style="width: 150px;">
                    <input type="text" ng-model="filtroTrazabilidadLab" name="table_search" class="form-control input-sm pull-right" placeholder="Buscar">
                    <div class="input-group-btn">
                        <button class="btn btn-sm btn-default">
                            <i class="zmdi zmdi-search"></i>
                        </button>
                    </div>
                </div>
            </div>
            <br>
            <br>
            <br>
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px;">
                    <h5 class="encabezadosTabla">
                        ANALISIS DE LABORATORIO
                        <!-- <a href="#/nvaTrazaLab/0/{{opcionCosechaC}}" class="btn btn-success btn-xs" style="float: right">
                            <i class="zmdi zmdi-plus"></i> Agregar
                        </a> -->

                        <button class="btn btn-success btn-xs" style="float: right" ng-click="nuevaTrazabilidad()">
                            <i class="zmdi zmdi-plus"></i> Agregar
                        </button>
                    </h5>
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="form-group">
                                <div class="col-md-2">
                                    <label style="margin-top: 5px" class="radio radio-inline m-r-20">
                                        <input type="radio" value="1" ng-model="opcionCosechaC">Convencional
                                        <i class="input-helper"></i>
                                    </label>
                                </div>
                                <div class="col-md-2">
                                    <label style="margin-top: 5px" class="radio radio-inline m-r-20">
                                        <input type="radio" value="2" ng-model="opcionCosechaC">Orgánica
                                        <i class="input-helper"></i>
                                    </label>
                                </div>
                                <div class="col-md-2">
                                    <label style="margin-top: 5px" class="radio radio-inline m-r-20">
                                        <input type="radio" value="5" ng-model="opcionCosechaC">Mantequilla
                                        <i class="input-helper"></i>
                                    </label>
                                </div>
                                <div class="col-md-2">
                                    <label style="margin-top: 5px" class="radio radio-inline m-r-20">
                                        <input type="radio" value="6" ng-model="opcionCosechaC">Altiplano
                                        <i class="input-helper"></i>
                                    </label>
                                </div>
                              
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-lg-12">
                            <div class="form-group">
                                <div class="col-md-2">
                                    <label style="margin-top: 5px" class="radio radio-inline m-r-20">
                                        <input type="radio" value="7" ng-model="opcionCosechaC">Naranjo
                                        <i class="input-helper"></i>
                                    </label>
                                </div>
                                <div class="col-md-2">
                                    <label style="margin-top: 5px" class="radio radio-inline m-r-20">
                                        <input type="radio" value="8" ng-model="opcionCosechaC">Aguacate
                                        <i class="input-helper"></i>
                                    </label>
                                </div>
                                <div class="col-md-2">
                                    <label style="margin-top: 5px" class="radio radio-inline m-r-20">
                                        <input type="radio" value="9" ng-model="opcionCosechaC">Mezquite
                                        <i class="input-helper"></i>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <br>
                    <div class="table-responsive no-padding">
                        <table class="table table-striped table-responsive">
                            <thead>
                                <tr>
                                    <th style="text-transform: none; font-weight: 600">N° de Lote</th>
                                    <th style="text-align: right; text-transform: none; font-weight: 600">Editar</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="infoLab in menuTrazabilidadLaboratorio|filter:filtroTrazabilidadLab">
                                    <!--                                <td>
                                                                                {{infoLab.lote}}
                                                                            </td>-->
                                    <td>
                                        {{infoLab.marcaFinalCliente}}
                                    </td>
                                    <td style="text-align: right">
                                        <a class="btn btn-warning btn-xs" ng-href="#/nvaTrazaLab/{{infoLab.idLoteInterno}}/{{infoLab.tipoMiel}}" title="Ver más">
                                            <i class="zmdi zmdi-edit"></i>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

</div>
