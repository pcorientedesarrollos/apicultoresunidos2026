<section class="content">
    <div class="row">
        <div class="col-lg-10 col-md-offset-1">
            <div class="box-tools col s4 visible-lg visible-md hidden-sm hidden-xs" style="float: right">
                <div class="input-group" style="width: 300px;">
                    <input type="text" ng-model="filtroCertificado" class="form-control input-sm pull-right"
                        placeholder="Ingrese lo que desea buscar">
                    <div class="input-group-btn">
                        <button class="btn btn-sm btn-warning">
                            <i class="zmdi zmdi-search"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="box-tools col-md-4 col-xs-4 visible-xs visible-sm hidden-md hidden-lg">
                <div class="input-group" style="width: 150px;">
                    <input type="text" ng-model="filtroCertificado" name="table_search"
                        class="form-control input-sm pull-right" placeholder="Buscar">
                    <div class="input-group-btn">
                        <button class="btn btn-sm btn-default">
                            <i class="zmdi zmdi-search"></i>
                        </button>
                    </div>
                </div>
            </div>
            <br><br><br>
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px;">
                    <h5 class="encabezadosTabla">
                        ENVIOS DE MUESTRAS
                        <a href="#/envioMuestra/0/0" class="btn btn-success btn-xs" style="float: right">
                            <i class="zmdi zmdi-plus"></i> Agregar
                        </a>
                    </h5>
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-md-3">
                            <select ng-disabled="cargandoDatos" chosen class="form-control" ng-model="verTipoDeMiel">
                                <option value="" selected disabled>Opciones</option>
                                <option value="1">Miel convencional</option>
                                <option value="2">Miel orgánica</option>
                            </select>
                        </div>
                    </div>
                    <br>
                    <div ng-if="envios && !envios.length">
                        No hay registros
                    </div>
                    <div ng-if="envios && envios.length">
                        <div class="table-responsive no-padding">
                            <table class="table table-striped table-responsive">
                                <thead>
                                    <tr>
                                        <th style="text-transform: none; font-weight: 600"></th>
                                        <th style=" text-transform: none; font-weight: 600">Fecha</th>
                                        <th style=" text-transform: none; font-weight: 600">Lugar</th>
                                        <th style=" text-transform: none; font-weight: 600">Marca laboratorio</th>
                                        <th style=" text-transform: none; font-weight: 600">Guía</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="envio in envios| filter:filtroCertificado">
                                        <td>{{$index + 1}}</td>
                                        <td>{{envio.fechaEnvio}}</td>
                                        <td>{{envio.lugarEnvio}}</td>
                                        <td>{{envio.marcaLaboratorio}}</td>
                                        <td>{{envio.guia}}</td>
                                        <td>
                                            <a class="btn btn-warning btn-xs"
                                                ng-href="#/envioMuestra/{{verTipoDeMiel}}/{{envio.idEnvio}}"
                                                title="Ver más">
                                                <i class="zmdi zmdi-edit" style="text-align: right;"></i>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<div growl>

</div>
