<section class="content" ng-controller="humedadesTamboCtrl">
    <div class="row">
        <div class="col-lg-12">
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px">
                    <h5 class="encabezadosTabla">
                        ANALISIS DE HUMEDAD
                    </h5>
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-md-3">
                            <div class="form-group">
                                <select chosen class="form-control" ng-model="mostrarMes"
                                    ng-options="mes.idMes as mes.mes for mes in listaDeMeses"
                                    ng-disabled="cargandoDatos">
                                    <option value="">Todo</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <select ng-disabled="cargandoDatos" chosen class="form-control" ng-model="opcionTipoMiel">
                                <option value="" selected disabled>Opciones</option>
                                <option value="1">Convencional</option>
                                <option value="2">Orgánica</option>
                                <option value="5">Mantequilla</option>
                                <option value="6">Altiplano</option>
                                <option value="7">Naranjo</option>
                                <option value="8">Aguacate</option>
                                <option value="9">Mezquite</option>
                            </select>
                        </div>
                    </div>
                    <br>
                    <div ng-if="entradas && !entradas.length">
                        No hay registros
                    </div>
                    <div ng-if="entradas && entradas.length">
                        <div class="table-responsive no-padding">
                            <table class="table table-striped table-responsive">
                                <thead>
                                    <tr>
                                        <th style="text-transform: none; font-weight: 600">Folio Comprobante</th>
                                        <th style="text-transform: none; font-weight: 600">Fecha</th>
                                        <th style="text-transform: none; font-weight: 600">Proveedor</th>
                                        <th style="text-transform: none; font-weight: 600">Localidad</th>
                                        <!-- <th style="text-transform: none; font-weight: 600">Muestras</th> -->
                                        <th style="text-transform: none; font-weight: 600">Análisis</th>
                                        <th style="text-transform: none; font-weight: 600"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="entrada in entradas|filter:filtroBusquedaLab">
                                        <td>{{entrada.folio}}</td>
                                        <td>{{entrada.fecha | date:'dd-MM-yyyy'}}</td>
                                        <td>{{entrada.nombre|uppercase}}</td>
                                        <td>{{entrada.localidad|uppercase}}</td>
                                        <!-- <td>{{entrada.datosAutorizados}}/{{entrada.muestras}}</td> -->
                                        <td>{{entrada.registros}}/{{entrada.muestras}}</td>
                                        <td>
                                            <a class="btn btn-warning btn-xs"
                                                ng-href="#/capturaHumedades/{{entrada.id}}/{{opcionTipoMiel}}"
                                                title="Añadir humedad">
                                                <i class="zmdi zmdi-edit"></i>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</section>
<div growl></div>
