<section class="content" ng-controller="empresasExternasCtrl">
    <div class="row">
        <div class="col-lg-12">
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px">
                    <h5 class="encabezadosTabla">
                        ANALISIS EXTERNOS
                        <a href="#/capturaAnalisisExternos/0" class="btn btn-success btn-xs" style="float: right">
                            <i class="zmdi zmdi-plus"></i>Agregar
                        </a>
                    </h5>
                </div>
                <div class="box-body">
                    <div ng-if="analisisExternos && !analisisExternos.length">
                        No hay registros
                    </div>
                    <div ng-if="analisisExternos && analisisExternos.length">
                        <div class="table-responsive no-padding">
                            <table class="table table-striped table-responsive">
                                <thead>
                                    <tr>
                                        <th style="text-transform: none; font-weight: 600"></th>
                                        <th style="text-transform: none; font-weight: 600">Fecha</th>
                                        <th style="text-transform: none; font-weight: 600">Tipo de miel</th>
                                        <th style="text-transform: none; font-weight: 600">Empresa</th>
                                        <th style="text-transform: none; font-weight: 600">Floración</th>
                                        <th style="text-transform: none; font-weight: 600">Tambos</th>
                                        <th style="text-transform: none; font-weight: 600"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="analisis in analisisExternos|filter:filtroBusquedaLab">
                                        <td>{{$index + 1}}</td>
                                        <td>{{analisis.fecha}}</td>
                                        <td>{{analisis.tipoDeMiel}}</td>
                                        <td>{{analisis.nombre}}</td>
                                        <td>{{analisis.floracion}}</td>
                                        <td>{{analisis.numeroTambos}}</td>
                                        <td>
                                            <a class="btn btn-warning btn-xs"
                                                ng-href="#/capturaAnalisisExternos/{{analisis.idAnalisisEncabezado}}"
                                                title="Añadir humedad">
                                                <i class="zmdi zmdi-edit"></i>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</section>
<div growl></div>
