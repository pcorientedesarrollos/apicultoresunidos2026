<section class="content">
    <div class="row">
        <div class="col-lg-12">
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px">
                    <h5>VERIFICACIÓN DE HUMEDADES</h5>
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-xs-10 col-md-3">
                            <div class="form-group">
                                <label>Tipo de miel *</label>
                                <select chosen class="form-control" ng-model="folios.tipoDeMiel">
                                    <option value="">Selecciona...</option>
                                    <option value="1">Miel 100% pura de abeja</option>
                                    <option value="2">Miel 100% orgánica</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-xs-2 col-md-3 col-md-offset-6">
                            <label for="">&nbsp;</label>
                            <button title="Imprimir PDF" class="btn btn-danger pull-right" ng-click="validarFolio()">
                                <i class="fa fa-file-pdf-o"></i>
                            </button>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-xs-12">
                            <div class="form-inline">
                                <div class="form-group">
                                    <label class="sr-only" for="foliosInicial">Folio Inicial: </label>
                                    <input type="number" min="0" id="foliosInicial" ng-model="folios.inicial" placeholder="Folio Inicial" class="form-control"
                                    />
                                </div>
                                <div class="form-group">
                                    <label class="sr-only" for="foliosFinal">Folio Final: </label>
                                    <input type="number" min="0" id="foliosFinal" ng-model="folios.final" placeholder="Folio Final" class="form-control" />
                                </div>

                                <button title="Limpiar los campos" class="btn btn-default btn-sm" ng-click="Borrar()">
                                    Limpiar
                                </button>

                                <button title="Generar lista" class="btn btn-success btn-sm" ng-click="infoHumedad()">
                                    Generar
                                </button>
                            </div>
                        </div>
                    </div>
                    <br>
                    <div class="row">
                        <div class="col-xs-12">
                            <div class="table-responsive">
                                <table class="table table-bordered table-condensed">
                                    <thead>
                                        <tr>
                                            <th style="text-transform: none; font-weight: 600;">#</th>
                                            <th style="text-transform: none; font-weight: 600;">Fecha</th>
                                            <th style="text-transform: none; font-weight: 600;">#Folio</th>
                                            <th style="text-transform: none; font-weight: 600;">Apicultor</th>
                                            <th style="text-transform: none; font-weight: 600;">Procedencia</th>
                                        </tr>
                                    </thead>
                                    <tr ng-repeat="rHumedad in dataHumedad">
                                        <td ng-bind="rHumedad.num"></td>
                                        <td ng-bind="rHumedad.fecha"></td>
                                        <td ng-bind="rHumedad.idAlmacen"></td>
                                        <td ng-bind="rHumedad.nombre"></td>
                                        <td ng-bind="rHumedad.localidad"></td>
                                    </tr>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<div growl></div>
