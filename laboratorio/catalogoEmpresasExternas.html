<section class="content" ng-controller="empresasExternasCtrl">
    <div class="row">
        <div class="col-lg-12">
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px">
                    <h5 class="encabezadosTabla">
                        EMPRESAS EXTERNAS
                        <a href="#/capturaExternos/0" class="btn btn-success btn-xs" style="float: right">
                            <i class="zmdi zmdi-plus"></i>Agregar
                        </a>
                    </h5>
                </div>
                <div class="box-body">
                    <div ng-if="externos && !externos.length">
                        No hay registros
                    </div>
                    <div ng-if="externos && externos.length">
                        <div class="table-responsive no-padding">
                            <table class="table table-striped table-responsive">
                                <thead>
                                    <tr>
                                        <th style="text-transform: none; font-weight: 600"></th>
                                        <th style="text-transform: none; font-weight: 600">Nombre</th>
                                        <th style="text-transform: none; font-weight: 600">Localidad</th>
                                        <th style="text-transform: none; font-weight: 600">Contacto</th>
                                        <th style="text-transform: none; font-weight: 600">Teléfono</th>
                                        <th style="text-transform: none; font-weight: 600"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="externo in externos|filter:filtroBusquedaLab">
                                        <td>{{$index + 1}}</td>
                                        <td>{{externo.nombre}}</td>
                                        <td>{{externo.localidad}}</td>
                                        <td>{{externo.contacto}}</td>
                                        <td>{{externo.telefono}}</td>
                                        <td>
                                            <a class="btn btn-warning btn-xs"
                                                ng-href="#/capturaExternos/{{externo.idExterno}}"
                                                title="Añadir humedad">
                                                <i class="zmdi zmdi-edit"></i>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</section>
<div growl></div>
