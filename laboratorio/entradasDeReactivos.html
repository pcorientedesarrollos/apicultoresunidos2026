<section class="content" ng-controller="reactivosEntradaCtrl">
    <div class="row">
        <div class="col-lg-12">
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px">
                    <h5 class="encabezadosTabla">
                        ENTRADAS DE REACTIVOS
                        <a href="#/entradaReactivo/0" class="btn btn-success btn-xs" style="float: right">
                            <i class="zmdi zmdi-plus"></i>Agregar
                        </a>
                    </h5>
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-md-4">
                            <div class="form-group">
                                <select chosen class="form-control" ng-model="mostrarMes"
                                    ng-options="mes.idMes as mes.mes for mes in listaDeMeses"
                                    ng-disabled="cargandoDatos">
                                    <option value="">Todo</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div ng-if="entradasReactivos && !entradasReactivos.length">
                        No hay registros
                    </div>
                    <div ng-if="entradasReactivos && entradasReactivos.length">
                        <div class="table-responsive no-padding">
                            <table class="table table-striped table-responsive">
                                <thead>
                                    <tr>
                                        <th style="text-transform: none; font-weight: 600"></th>
                                        <th style="text-transform: none; font-weight: 600">Fecha</th>
                                        <th style="text-transform: none; font-weight: 600">Nombre</th>
                                        <th style="text-transform: none; font-weight: 600">Total</th>
                                        <th style="text-transform: none; font-weight: 600"></th>
                                        <th style="text-transform: none; font-weight: 600"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="entrada in entradasReactivos|filter:filtroBusquedaLab">
                                        <td>{{$index + 1}}</td>
                                        <td>{{entrada.fecha}}</td>
                                        <td>{{entrada.nombreProveedor}}</td>
                                        <td>{{entrada.total}}</td>
                                        <td>
                                            <a class="btn btn-warning btn-xs"
                                                ng-href="#/entradaReactivo/{{entrada.idEntrada}}" title="Ver detalle">
                                                <i class="zmdi zmdi-edit"></i>
                                            </a>
                                        </td>
                                        <td>
                                            <a type="button" class="btn btn-danger btn-xs" title="Eliminar registro"
                                                ng-click="eliminarRegistro(entrada.idEntrada)">
                                                <i class="fa fa-trash"></i>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</section>
<div growl></div>
