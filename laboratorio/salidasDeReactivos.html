<section class="content" ng-controller="reactivosSalidaCtrl">
    <div class="row">
        <div class="col-lg-12">
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px">
                    <h5 class="encabezadosTabla">
                        CONFORMACIONES DE HOMOGÉNEO
                        <a href="#/salidaReactivo/0/0" class="btn btn-success btn-xs" style="float: right">
                            <i class="zmdi zmdi-plus"></i>Agregar
                        </a>
                    </h5>
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-md-4">
                            <select chosen class="form-control" ng-model="opcionCosecha" ng-disabled="cargandoDatos">
                                <option value="" disabled selected>Tipo de miel</option>
                                <option value="1">Miel 100% pura de abeja</option>
                                <option value="2">Miel 100% orgánica</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <select chosen class="form-control" ng-model="mostrarMes"
                                    ng-options="mes.idMes as mes.mes for mes in listaDeMeses"
                                    ng-disabled="cargandoDatos">
                                    <option value="">Todo</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div ng-if="salidasReactivos && !salidasReactivos.length">
                        No hay registros
                    </div>
                    <div ng-if="salidasReactivos && salidasReactivos.length">
                        <div class="table-responsive no-padding">
                            <table class="table table-striped table-responsive">
                                <thead>
                                    <tr>
                                        <th style="text-transform: none; font-weight: 600"></th>
                                        <th style="text-transform: none; font-weight: 600">Fecha</th>
                                        <th style="text-transform: none; font-weight: 600">Tipo</th>
                                        <th class="text-center" style="text-transform: none; font-weight: 600">Número de
                                            tambos</th>
                                        <th style="text-transform: none; font-weight: 600">Resultado</th>
                                        <th style="text-transform: none; font-weight: 600">Analizado por</th>
                                        <th style="text-transform: none; font-weight: 600"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="salida in salidasReactivos|filter:filtroBusquedaLab">
                                        <td>{{$index + 1}}</td>
                                        <td>{{salida.fecha}}</td>
                                        <td>{{salida.analisis}}</td>
                                        <td class="text-center">{{salida.numeroTambos}}</td>
                                        <td>{{salida.resultadoN}}</td>
                                        <td>{{salida.nombre}}</td>
                                        <td>
                                            <a class="btn btn-warning btn-xs"
                                                ng-href="#/salidaReactivo/{{salida.idEncabezado}}/{{opcionCosecha}}" title="Ver detalle">
                                                <i class="zmdi zmdi-edit"></i>
                                            </a>
                                        </td>
                                        <!-- <td>
                                            <a type="button" class="btn btn-danger btn-xs" title="Eliminar registro"
                                                ng-click="eliminarRegistro(salida.idSalida)">
                                                <i class="fa fa-trash"></i>
                                            </a>
                                        </td> -->
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</section>
<div growl></div>
