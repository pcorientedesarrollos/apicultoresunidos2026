<section class="content">
    <div class="row">
        <div class="col-lg-12">
            <div class="box-tools col s4 visible-lg visible-md hidden-sm hidden-xs" style="float: right">
                <div class="input-group" style="width: 300px;">
                    <input type="text" ng-model="filtroBusquedaLab" class="form-control input-sm pull-right"
                        placeholder="Ingrese lo que desea buscar">
                    <div class="input-group-btn">
                        <button class="btn btn-sm btn-warning">
                            <i class="zmdi zmdi-search"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="box-tools col-sm-4 col-xs-4 visible-xs visible-sm hidden-md hidden-lg">
                <div class="input-group" style="width: 150px;">
                    <input type="text" ng-model="filtroBusquedaLab" name="table_search"
                        class="form-control input-sm pull-right" placeholder="Buscar">
                    <div class="input-group-btn">
                        <button class="btn btn-sm btn-default">
                            <i class="zmdi zmdi-search"></i>
                        </button>
                    </div>
                </div>
            </div>
            <br>
            <br>
            <br>
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px">
                    <h5 class="encabezadosTabla">
                        ANALISIS A MIEL SOBRANTE
                    </h5>
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-md-3">
                            <div class="form-group">
                                <select chosen class="form-control" ng-model="mostrarMes"
                                    ng-options="mes.idMes as mes.mes for mes in listaDeMeses"
                                    ng-disabled="cargandoDatos">
                                    <option value="">Todo</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <select ng-disabled="cargandoDatos" chosen class="form-control" ng-model="verTipoDeMiel">
                                <option value="" selected disabled>Opciones</option>
                                <option value="1">Convencional</option>
                                <option value="2">Orgánica</option>
                                <option value="5">Mantequilla</option>
                                <option value="6">Altiplano</option>
                                <option value="7">Naranjo</option>
                                <option value="8">Aguacate</option>
                                <option value="9">Mezquite</option>
                            </select>
                        </div>
                        <div class="col-md-3"></div>
                        <div class="col-md-3">
                            <button style="margin-right: 20px" title="Exportar Excel" ng-click="excelSobrantes()"
                                class="pull-right btn btn-success btn-sm">
                                <i class="fa fa-file-excel-o"></i> Exportar
                            </button>
                        </div>
                    </div>
                    <br>
                    <div ng-if="listaSobrantes && !listaSobrantes.length">
                        No hay registros
                    </div>
                    <div ng-if="listaSobrantes && listaSobrantes.length">
                        <div class="table-responsive no-padding">
                            <table class="table table-striped table-responsive">
                                <thead>
                                    <tr>
                                        <th style="text-transform: none; font-weight: 600">Folio Comprobante</th>
                                        <th style="text-transform: none; font-weight: 600">Fecha</th>
                                        <th style="text-transform: none; font-weight: 600">Sobrante</th>
                                        <th style="text-transform: none; font-weight: 600">Tipo</th>
                                        <!-- <th style="text-transform: none; font-weight: 600">Localidad</th> -->
                                        <!-- <th style="text-transform: none; font-weight: 600">Muestras</th> -->
                                        <!-- <th style="text-transform: none; font-weight: 600">Análisis</th> -->
                                        <th style="text-transform: none; font-weight: 600">Agregar</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="mL in listaSobrantes|filter:filtroBusquedaLab">
                                        <td>{{mL.idEncabezadoSobrante}}</td>
                                        <td>{{mL.fecha | date:'dd-MM-yyyy'}}</td>
                                        <td>{{mL.sobrante|uppercase}}</td>
                                        <td>{{mL.tipo|uppercase}}</td>
                                        <td>
                                            <a class="btn btn-warning btn-xs"
                                                ng-href="#/capturaAMS/{{mL.idEncabezadoSobrante}}/{{verTipoDeMiel}}"
                                                title="Agregar precios">
                                                <i class="zmdi zmdi-edit"></i>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</section>

<div growl></div>
