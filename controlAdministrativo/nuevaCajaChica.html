<section class="content">
    <div class="row">
        <div class="col-lg-12">
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px;">
                    <h5 class="encabezadosTabla">
                        CAJA CHICA
                        <a title="Regresar" href="#/cajaChica" class="btn btn-success btn-xs" style="float: right">
                            <i class="zmdi zmdi-arrow-left"></i>
                        </a>
                    </h5>
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="row">
                                <div class="col-xs-12 col-sm-6">
                                    <h4>Movimientos de {{mes.mes}}</h4>
                                </div>
                                <div class="col-xs-12 col-sm-6">
                                    <div class="form-group pull-right">
                                        <button type="button" class="btn btn-success btn-sm" ng-disabled="mes.block"
                                            ng-click="cerrarCajaChica()">
                                            <i class="fa fa-lock"></i> Cerrar mes
                                        </button>
                                        <button type="button" class="btn btn-danger btn-sm"
                                            ng-click="abrirModalImprimirReporteMensual(1)">
                                            <i class="fa fa-file-pdf-o"></i>
                                        </button>
                                        <button type="button" class="btn btn-success btn-sm"
                                            ng-click="abrirModalImprimirReporteMensual(2)">
                                            <i class="fa fa-file-excel-o"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-xs-12 col-md-4">
                                    <div class="form-group">
                                        <label>Saldo</label>
                                        <input type="text" class="form-control" disabled
                                            ng-value="saldoCajaChica | currency">
                                    </div>
                                </div>
                                <div class="col-xs-12 col-md-4">
                                    <div class="form-group">
                                        <label>Pendiente</label>
                                        <input type="text" class="form-control" disabled
                                            ng-value="totalPendientes | currency">
                                    </div>
                                </div>
                                <div class="col-xs-12 col-md-4">
                                    <div class="form-group">
                                        <label>Saldo Actual</label>
                                        <input type="text" class="form-control" disabled
                                            ng-value="saldoActualCajaChica | currency">
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-xs-12 col-sm-12 col-md-6  col-md-offset-6" align="right">
                                    <div class="input-group" style="width: 300px;">
                                        <input type="text" ng-model="busquedaMovimiento"
                                            class="form-control input-sm pull-right"
                                            placeholder="Ingrese lo que desea buscar">
                                        <div class="input-group-btn">
                                            <button class="btn btn-sm btn-warning">
                                                <i class="zmdi zmdi-search"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="clearfix"></div>
                            <hr>
                            <div class="table-responsive">
                                <table class="table table-responsive table-bordered table-condensed">
                                    <thead style="text-align: center;">
                                        <tr>
                                            <th style="text-transform: none; text-align: center; font-size: 12px;"
                                                rowspan="1">Fecha</th>
                                            <th style="text-transform: none; text-align: center; font-size: 12px;"
                                                rowspan="1">Hora</th>
                                            <th style="text-transform: none; text-align: center; font-size: 12px;"
                                                rowspan="1">Nombre</th>
                                            <th style="text-transform: none; text-align: center; font-size: 12px;"
                                                rowspan="1">Ingreso</th>
                                            <th style="text-transform: none; text-align: center; font-size: 12px;"
                                                rowspan="1">Egreso</th>
                                            <th style="text-transform: none; text-align: center; font-size: 12px;"
                                                rowspan="1">Saldo</th>
                                            <th rowspan="1"></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr ng-repeat="cajaChica in datosCajaChica | filter:busquedaMovimiento"
                                            ng-class="cajaChica.tipo ? 'ingreso-green' : 'egreso-red'">
                                            <td style="text-transform: none; text-align: center;"
                                                ng-bind="cajaChica.fecha | date:'dd-MM-yyyy'"></td>
                                            <td style="text-transform: none; text-align: center;"
                                                ng-bind="cajaChica.hora"></td>
                                            <td style="text-transform: none; text-align: left;"
                                                ng-bind="cajaChica.nombre | uppercase"></td>
                                            <td style="text-transform: none; text-align: right;"
                                                ng-bind="cajaChica.ingreso | currency"></td>
                                            <td style="text-transform: none; text-align: right;"
                                                ng-bind="cajaChica.egreso | currency"></td>
                                            <td style="text-transform: none; text-align: right;"
                                                ng-bind="cajaChica.saldo  | currency"></td>
                                            <td style="text-transform: none; text-align: center;">
                                                <a href="#/movimiento/{{cajaChica.idCajaChica}}"
                                                    class="btn btn-xs btn-warning">
                                                    <i class="fa fa-pencil"></i>
                                                </a>
                                                <button type="button" class="btn btn-xs btn-danger"
                                                    ng-click="eliminarMovimientoCajaChica($index, cajaChica.idCajaChica);">
                                                    <i class="fa fa-trash"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<div class="modal fade" id="modalImprimirReporteMensual" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Imprimir el reporte mensual</h4>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-xs-12">
                        <div class="form-group">
                            <label class="radio-inline">
                                <input type="radio" name="optImprimirReporteMensual"
                                    ng-model="optImprimirReporteMensual.tipo" value="1"> Por período
                            </label>
                            <label class="radio-inline">
                                <input type="radio" name="optImprimirReporteMensual"
                                    ng-model="optImprimirReporteMensual.tipo" value="2"> Todo el mes
                            </label>
                        </div>
                    </div>
                </div>

                <div class="row" ng-if="optImprimirReporteMensual.tipo == 1">
                    <div class="col-xs-12 col-md-6">
                        <div class="form-group">
                            <label>Fecha inicial</label>
                            <div class="input-group date" data-provide="datepicker">
                                <div class="input-group-addon">
                                    <i class="fa fa-calendar"></i>
                                </div>
                                <input type="text" class="form-control pull-right" id="datepicker"
                                    placeholder="Fecha inicial" ng-model="optImprimirReporteMensual.fechaInicial">
                            </div>
                        </div>
                    </div>
                    <div class="col-xs-12 col-md-6">
                        <div class="form-group">
                            <label>Fecha final</label>
                            <div class="input-group date" data-provide="datepicker">
                                <div class="input-group-addon">
                                    <i class="fa fa-calendar"></i>
                                </div>
                                <input type="text" class="form-control pull-right" id="datepicker"
                                    placeholder="Fecha final" ng-model="optImprimirReporteMensual.fechaFinal">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success"
                    ng-click="imprimirReporteCajaChica(optImprimirReporteMensual)">Imprimir</button>
                <button type="button" class="btn btn-danger" data-dismiss="modal">Salir</button>
            </div>
        </div>
    </div>
</div>


<div growl></div>
