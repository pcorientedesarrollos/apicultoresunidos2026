<section class="content">
    <div class="row">
        <div class="col-lg-4 col-lg-offset-4">
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px;">
                    <h5 class="encabezadosTabla">
                        LISTA DE BANCOS
                        <a href="#/nvoBanco/0" class="btn btn-success btn-xs" style="float: right">
                            <i class="zmdi zmdi-plus"></i> Agregar
                        </a>
                    </h5>
                </div>

                <div class="box-body table-responsive no-padding">
                    <table class="table table-striped table-responsive">
                        <thead>
                            <tr>
                                <th style="text-transform: none; font-weight: 600">N°</th>
                                <th style="text-transform: none; font-weight: 600">Nombre</th>
                                <th style="text-align: right; text-transform: none; font-weight: 600">Editar</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr ng-repeat="ban in menuBancos">
                                <td>
                                    {{$index +1}}
                                </td>
                                <td>{{ban.banco}}</td>
                                <td style="text-align: right">
                                    <a class="btn btn-warning btn-xs" ng-href="#/nvoBanco/{{ban.idBanco}}" title="Ver más">
                                        <i class="zmdi zmdi-edit" ></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>
