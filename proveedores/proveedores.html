<section class="content">
    <div class="row">
        <div class="col-lg-12">
            <div class="box-tools col s4 visible-lg visible-md hidden-sm hidden-xs" style="float: right">
                <div class="input-group" style="width: 300px;">
                    <input type="text" ng-model="filtroBusquedaProveedor" class="form-control input-sm pull-right" placeholder="Ingrese lo que desea buscar">
                    <div class="input-group-btn">
                        <button class="btn btn-sm btn-warning">
                            <i class="zmdi zmdi-search"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="box-tools col-sm-4 col-xs-4 visible-xs visible-sm hidden-md hidden-lg">
                <div class="input-group" style="width: 150px;">
                    <input type="text" ng-model="filtroBusquedaProveedor" name="table_search" class="form-control input-sm pull-right" placeholder="Buscar">
                    <div class="input-group-btn">
                        <button class="btn btn-sm btn-default">
                            <i class="zmdi zmdi-search"></i>
                        </button>
                    </div>
                </div>
            </div>
            <br>
            <br>
            <br>
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px;">
                    <h5 class="encabezadosTabla">
                        PROVEEDORES DE MIEL
                        <a href="#nvoProveedor/0" class="btn btn-success btn-xs" style="float: right">
                            <i class="zmdi zmdi-account-add"></i> Agregar
                        </a>
                    </h5>
                </div>
                <br>

                <div class="box-body">
                    <div class="row">
                        <div class="col-md-12">
                            <div class="col-sm-4">
                                <div class="form-group">
                                    <select ng-model="filtros.tipoProveedor" chosen class="form-control" ng-options="m.idTipoDeMiel as m.tipoDeMiel for m in tiposDeMiel">
                                        <option disabled="disabled" value="">Seleccione una opcion</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-sm-4">
                                <div class="form-group">
                                    <select chosen class="form-control" ng-model="filtros.estadoProveedor">
                                        <option value="" selected>SELECCIONA UNA OPCIÓN</option>
                                        <option value="0">Activos</option>
                                        <option value="1">Inactivos</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    <br>
                    <div class="table-responsive no-padding" ng-show="infoProveedor.length > 0">
                        <table class="table table-striped table-responsive">
                            <thead>
                                <tr>
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">No.</th>
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">Comprador</th>
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">Zona</th>
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">Nombre </th>
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">Localidad</th>
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">Estado</th>
                                    <th ng-hide="filtros.tipoProveedor == '4'" class="bgm-blue" style="text-transform: none; font-weight: 600">ID Sagarpa</th>
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">Editar</th>
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">Estado</th>
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">Eliminar</th>
                                </tr>
                            </thead>
                            <tr ng-repeat="prov in infoProveedor|filter:filtroBusquedaProveedor">
                                <td>{{$index + 1}}</td>
                                <td>{{prov.nombreComprador|uppercase}}</td>
                                <td>{{prov.zona|uppercase}}</td>
                                <td>{{prov.nombre|uppercase}}</td>
                                <td>{{prov.localidad|uppercase}}</td>
                                <td>{{prov.estado|uppercase}}</td>
                                <td ng-hide="filtros.tipoProveedor == '4'">{{prov.sagarpa|uppercase}}</td>
                                <td ng-if="prov.activoInactivo == 0" class="text-center">
                                    <a ng-href="#nvoProveedor/{{prov.id}}" class="btn btn-warning btn-xs">
                                        <i class="zmdi zmdi-edit"></i>
                                    </a>
                                </td>
                                <td ng-if="prov.activoInactivo == 1" class="text-center">
                                    <a disabled class="btn btn-warning btn-xs">
                                        <i class="zmdi zmdi-edit"></i>
                                    </a>
                                </td>
                                <td class="text-center">
                                    <a ng-show="prov.activoInactivo == 1" ng-click="activarProveedor(prov.id)" class="btn btn-danger btn-xs">
                                        <i class="fa fa-thumbs-o-down "></i>
                                    </a>
                                    <a ng-show="prov.activoInactivo == 0" ng-click="desactivarProveedor(prov.id)" class="btn btn-success btn-xs">
                                        <i class="fa fa-thumbs-o-up "></i>
                                    </a>
                                </td>
                                <td ng-show="prov.activoInactivo == 1" class="text-center">
                                    <a ng-click="eliminarProveedor(prov.id)" class="btn btn-danger btn-xs">
                                        <i class="fa fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
