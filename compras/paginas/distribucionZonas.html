<section class="content">
    <div class="row">
        <div class="col-md-10 col-md-offset-1">
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px;">
                    <h5 class="encabezadosTabla">
                        DISTRIBUCIÓN DE ZONAS
                        <a href="#/distribucion/nuevo" class="btn btn-success btn-xs" style="float: right">
                            <i class="zmdi zmdi-plus"></i> Agregar
                        </a>
                    </h5>
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-md-4 col-md-offset-6">
                            <div class="input-group">
                                <input type="text" ng-model="busquedaZona" class="form-control input-sm pull-right"
                                    placeholder="Ingrese lo que desea buscar">
                                <div class="input-group-btn">
                                    <button class="btn btn-sm btn-warning"><i class="zmdi zmdi-search"></i></button>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-2">
                            <a href="#/catalogoCompras">
                                <button class="btn btn-warning btn-sm">Ver catálogos</button>
                            </a>
                        </div>
                    </div>
                    <br>
                    <div class="table-responsive no-padding">
                        <table class="table table-striped table-condensed">
                            <thead>
                                <tr style="height: 35px">
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">Zona</th>
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">Referencia</th>                                   
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">Comprador </th>
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">Editar</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="distribucion in distribuciones| filter:busquedaZona">
                                    <td>{{distribucion.zona|uppercase}}</td>
                                    <td>{{distribucion.referencia|uppercase}}</td>
                                    <td>{{distribucion.comprador|uppercase}}</td>
                                    <td>
                                        <a href="#/distribucion/{{distribucion.idzona}}" class="btn btn-warning btn-xs">
                                            <i class="zmdi zmdi-edit"></i>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<div growl></div>
