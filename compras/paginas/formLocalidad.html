<section class="content">
    <div class="row">
        <div class="col-sm-8 col-sm-offset-2 texto" ng-controller="formLocalidadCtrl">
            <div class="box-tools col s4 visible-lg visible-md hidden-sm hidden-xs" style="float: right">
                <div class="input-group" style="width: 300px;">
                    <input type="text" ng-model="busquedaLocalidad" class="form-control input-sm pull-right" placeholder="Ingrese lo que desea buscar">
                    <div class="input-group-btn">
                        <button class="btn btn-sm btn-warning"><i class="zmdi zmdi-search"></i></button>
                    </div>
                </div>
            </div>
            <div class="box-tools col-sm-4 col-xs-4 visible-xs visible-sm hidden-md hidden-lg">
                <div class="input-group" style="width: 150px;">
                    <input type="text" ng-model="busquedaLocalidad" name="table_search" class="form-control input-sm pull-right" placeholder="Buscar">
                    <div class="input-group-btn">
                        <button class="btn btn-sm btn-default"><i class="zmdi zmdi-search"></i></button>
                    </div>
                </div>
            </div>
            <br><br><br>
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px;">
                    <h5 class="encabezadosTabla">
                        LOCALIDADES
                        <a href="#/editarLocalidad/nuevo" class="btn btn-success btn-xs" style="float: right">
                            <i class="zmdi zmdi-plus"></i> Agregar
                        </a>
                    </h5>
                </div>
                <div class="box-body table-responsive no-padding">
                    <table class="table table-striped table-responsive">
                        <thead>
                            <tr style="height: 35px">
                                <th style="text-transform: none; font-weight: 600">Localidad</th>
                                <th style="text-transform: none; font-weight: 600">Zona</th>                                
                                <th style="text-transform: none; font-weight: 600">Comprador </th>
                                <th style="text-transform: none; font-weight: 600">Editar</th>
                            </tr>
                        </thead>
                        <tr ng-repeat="lcl in localidad| filter:busquedaLocalidad">
                            <td>{{lcl.localidad|uppercase}}</td>                
                            <td>{{lcl.zona|uppercase}}</td>
                            <td>{{lcl.nombre|uppercase}}</td>
                            <td>
                                <a href="#/editarLocalidad/{{lcl.idlocalidad}}" class="btn btn-warning btn-xs">
                                    <i class="zmdi zmdi-edit"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>
