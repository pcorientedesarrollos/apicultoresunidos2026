<section class="content">
    <div class="row">
        <div class="col-sm-8 col-sm-offset-2" ng-controller="compradorCtrl">
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px">
                    <h5 class="encabezadosTabla">
                        CATÁLOGOS
                        <a title="Regresar" href="#/distribucionZonas" class="btn btn-success btn-xs"
                            style="float: right">
                            <i class="zmdi zmdi-arrow-left"></i>
                        </a>
                    </h5>
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-md-4 col-md-offset-8">
                            <div class="input-group">
                                <input type="text" ng-model="busquedaCatalogos" class="form-control input-sm pull-right"
                                    placeholder="Ingrese lo que desea buscar">
                                <div class="input-group-btn">
                                    <button class="btn btn-sm btn-warning"><i class="zmdi zmdi-search"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <select chosen class="form-control" ng-model="opcionCatalogo"
                                ng-change="verCatalogo(opcionCatalogo)">
                                <option value="" disabled selected>Seleccione una opción</option>
                                <option value="1">Compradores</option>
                                <option value="2">Zonas</option>
                                <option value="3">Localidades</option>
                                <option value="4">Transportes</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <button type="button" class="btn btn-xs btn-warning" ng-click="abrirModal(opcionCatalogo);"
                                title="Añadir nuevo">Agregar</button>
                        </div>
                    </div>
                    <br>
                    <div class="table-responsive no-padding">
                        <table class="table table-striped table-condensed">
                            <thead>
                                <tr style="height: 35px;">
                                    <th style="text-transform: none; font-weight: 600">No.</th>
                                    <th style="text-transform: none; font-weight: 600">Nombre </th>
                                    <th style="text-transform: none; font-weight: 600" ng-if="opcionCatalogo == '2'">
                                        Localidad de referencia </th>
                                    <th style="text-transform: none; font-weight: 600" ng-if="opcionCatalogo == '3'">
                                        Estado </th>
                                    <th style="text-transform: none; font-weight: 600" ng-if="opcionCatalogo == '1'">
                                        Teléfono</th>
                                    <th style="text-transform: none; font-weight: 600">Editar</th>
                                </tr>
                            </thead>
                            <tr ng-repeat="catalogo in catalogos | filter:busquedaCatalogos">
                                <td>{{$index + 1}}</td>
                                <td>{{catalogo.nombre}}</td>
                                <td ng-if="opcionCatalogo == '2'">{{catalogo.referencia}}</td>
                                <td ng-if="opcionCatalogo == '3'">{{catalogo.estado}}</td>
                                <td ng-if="opcionCatalogo == '1'">{{catalogo.telefono}}</td>
                                <td>
                                    <button type="button" class="btn btn-xs"
                                        ng-click="abrirModal(opcionCatalogo, catalogo.id);" title="Ver/Editar">
                                        <i class="zmdi zmdi-edit"></i></button>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<div class="modal fade" id="modalCatalogoCompras" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">REGISTRO DE CATÁLOGO {{registroCatalogo.catalogo}}</h4>
            </div>
            <div class="modal-body">
                <div>
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="col-lg-6">
                                <div class="form-group">
                                    <label>Nombre</label>
                                    <input ng-model="registroCatalogo.nombre" type="text" class="form-control" />
                                </div>
                            </div>
                            <div class="col-lg-6" ng-if="registroCatalogo.opcionCatalogo == 1">
                                <div class="form-group">
                                    <label>Teléfono</label>
                                    <input type="text" ng-model="registroCatalogo.telefono" class="form-control" />
                                </div>
                            </div>
                            <div class="col-lg-6" ng-if="registroCatalogo.opcionCatalogo == 2">
                                <div class="form-group">
                                    <label>Localidad de referencia</label>
                                    <input ng-model="registroCatalogo.referencia" type="text" class="form-control" />
                                </div>
                            </div>
                            <div class="col-xs-12 col-md-6" ng-if="registroCatalogo.opcionCatalogo == 3">
                                <div class="form-group">
                                    <label>Estado</label>
                                    <select ng-model="registroCatalogo.idEstado" class="form-control"
                                        ng-options="estados.idEstado as estados.estado for estados in listaEstados">
                                        <option disabled="disabled" value="">Nombre</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-6" ng-if="registroCatalogo.opcionCatalogo == 4">
                                <div class="form-group">
                                    <label>Marca</label>
                                    <input type="text" ng-model="registroCatalogo.marca" class="form-control" />
                                </div>
                            </div>
                            <div class="col-lg-6" ng-if="registroCatalogo.opcionCatalogo == 4">
                                <div class="form-group">
                                    <label>Modelo</label>
                                    <input type="text" ng-model="registroCatalogo.modelo" class="form-control" />
                                </div>
                            </div>
                            <div class="col-lg-6" ng-if="registroCatalogo.opcionCatalogo == 4">
                                <div class="form-group">
                                    <label>Placas</label>
                                    <input type="text" ng-model="registroCatalogo.placas" class="form-control" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success"
                    ng-click="guardarRegistroCatalogo(registroCatalogo);">Guardar</button>
                <button type="button" class="btn btn-danger" data-dismiss="modal">Salir</button>
            </div>
        </div>
    </div>
</div>
<div growl></div>
