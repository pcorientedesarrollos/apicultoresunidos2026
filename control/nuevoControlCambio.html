<div class="col-lg-8 col-lg-offset-2">
    <div class="card">
        <div class="card-header bgm-miel">
            <h2 style="font-family: 'Didact Gothic', sans-serif; text-transform: uppercase">Control</h2>
            <a title="Regresar" class="btn bgm-red btn-float waves-effect"
               href="#/ctrl">
                <i class="zmdi red zmdi-undo"></i>
            </a>
        </div>
        <div class="card-body card-padding">
            <div class="row">
                <!--  <div class="card-header">
                      <h4 class="page-header">
                          Datos del empleado
                      </h4>
                  </div>-->
                <br>
                <div class="col-lg-12">
                    <div class="row">
                        <div class="col-lg-3 col-lg-offset-8">
                            <div class="form-group">
                                <label style="font-weight: bold;"  class="col-sm-3 control-label text-primary">Fecha</label>
                                <div class="col-sm-9">
                                    <input 
                                        type="date" 
                                        date="dd/MM/yyyy"
                                        title="Fecha" 
                                        ng-model="cambios.fecha"/> 
                                </div>
                            </div>
                        </div>
                    </div>
                    <br>
                    <div class="row">
                        <div class="col-sm-12">
                            <div class="form-group"> 
                                <div class="row">
                                    <div class="col-lg-5">
                                        <div class="form-group"> 
                                            <label style="font-weight: bold;" class="col-sm-2 text-primary">Area</label>
                                            <div class="col-sm-10">
                                                <select 
                                                    chosen
                                                    ng-model="areaSeleccionada" 
                                                    class="form-control" 
                                                    ng-options="a.idArea as a.area for a in listaAreas"> 
                                                    <option value="">Area</option>   
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-7">
                                        <div class="form-group"> 
                                            <label style="font-weight: bold;" class="col-sm-3 text-primary">Responsable</label>
                                            <div class="col-sm-9">
                                                <select 
                                                    chosen
                                                    ng-model="responsableSeleccionado" 
                                                    class="form-control" 
                                                    ng-options="nr.idPersonalOM as nr.nombre for nr in nombresOM"> 
                                                    <option value="">Responsable</option>   
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <br>
                    <div class="row">
                        <div class="col-lg-12">
                            <label style="font-weight: bold;" class="col-sm-12 text-primary">Cambios</label>

                            <div class="col-lg-12">
                                <textarea class="form-control" 
                                          rows="4" 
                                          ng-model="cambios.observaciones" 
                                          placeholder="Escriba aquí todo lo que desee" 
                                          >
                                </textarea>
                            </div>
                        </div>
                    </div>
                    <br>
                    <div style="text-align: right">
                        <p class="right-align">
                            <button type="submit" ng-click="guardarCambio(cambios)" class="btn btn-primary right-align">
                                <i ></i> Guardar
                            </button>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
<div growl>

</div>
