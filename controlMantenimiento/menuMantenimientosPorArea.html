<section class="content">
    <div class="row">
        <div class="col-lg-10 col-lg-offset-1">
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px;">
                    <h5 class="encabezadosTabla">
                        PAGO A MANTENIMIENTOS
                        <!--                        <a title="Regresar" href="#/menuManttosArea/{{}}" class="btn btn-success btn-xs" style="float: right">
                                                    <i class="zmdi zmdi-arrow-left"></i> 
                                                </a>-->
                    </h5>
                </div>
                <div class="box-body">
                    <div class="box-header">
                        <h3 align="center">{{areaDelMantto.area}}</h3>
                    </div>
                    <div class="table-responsive no-padding">
                        <table class="table table-striped table-responsive">
                            <thead>
                                <tr style="height: 35px">
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">Fecha</th>
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">Equipo</th>
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">Código</th>
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">Proveedor</th>
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">Personal</th>
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600; text-align: right">Total Pago</th>
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">Pago</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="pp in menuMantenimientos">
                                    <td>{{pp.fechaReal}}</td>
                                    <td>{{pp.equipo|uppercase}}</td>
                                    <td>AF-MID-{{pp.idEquipo}}</td>
                                    <td>{{pp.nombre|uppercase}}</td>
                                    <td>{{pp.tipo|uppercase}}</td>
                                    <td style="text-align: right">{{pp.totalPago|currency}}</td>
                                    <td>
                                        <a href="#/pagarMantto/{{pp.idMantenimiento}}" class="btn btn-warning btn-xs">
                                            <i class="zmdi zmdi-money zmdi-hc-2x" ></i>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>
    </div>
</section>
