<section class="content">
    <div class="row">
        <div class="col-lg-6 col-lg-offset-3">
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px;">
                    <h5 class="encabezadosTabla">FECHAS PROGRAMADAS
                        <a href="#/nvaProgramacion/0" class="btn btn-success btn-xs" style="float: right">
                            <i class="zmdi zmdi-plus"></i> Agregar
                        </a>
                    </h5>
                </div>
                <div class="box-body table-responsive no-padding">
                    <table class="table table-striped table-responsive">
                        <thead>
                            <tr style="height: 35px">
                                <!--<th class="bgm-blue" style="text-transform: none; font-weight: 600">Area</th>-->
                                <th class="bgm-blue" style="text-transform: none; font-weight: 600">Equipo</th>
                                <th class="bgm-blue" style="text-transform: none; font-weight: 600">Fechas programadas</th>
                                <th class="bgm-blue" style="text-transform: none; font-weight: 600">Editar</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr ng-repeat="mp in menuProgramacion">
                                <!--<td>{{mp.area}}</td>-->
                                <td>{{mp.nombre}}</td>
                                <td>{{mp.programacion}}</td>
                                <!--<td>{{mp.periodicidad}}</td>-->
                                <td>
                                    <a href="#/verProgram/{{mp.idEquipo}}" class="btn btn-warning btn-xs">
                                        <i class="zmdi zmdi-edit"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>
