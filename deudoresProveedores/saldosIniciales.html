<section class="content">
    <div class="row">
        <div class="col-lg-12">
            <div class="box-tools col s4 visible-lg visible-md hidden-sm hidden-xs" style="float: right">
                <div class="input-group" style="width: 300px;">
                    <input type="text" ng-model="filtroBusquedaSaldos" class="form-control input-sm pull-right" placeholder="Ingrese lo que desea buscar">
                    <div class="input-group-btn">
                        <button class="btn btn-sm btn-warning">
                            <i class="zmdi zmdi-search"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="box-tools col-sm-4 col-xs-4 visible-xs visible-sm hidden-md hidden-lg">
                <div class="input-group" style="width: 150px;">
                    <input type="text" ng-model="filtroBusquedaSaldos" name="table_search" class="form-control input-sm pull-right" placeholder="Buscar">
                    <div class="input-group-btn">
                        <button class="btn btn-sm btn-default">
                            <i class="zmdi zmdi-search"></i>
                        </button>
                    </div>
                </div>
            </div>
            <br>
            <br>
            <br>
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px;">
                    <h5 class="encabezadosTabla">
                        SALDOS INICIALES
                    </h5>
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="table-responsive no-padding">
                                <table class="table table-bordered table-condensed" style="font-size: 10px">
                                    <thead>
                                        <tr>
                                            <th style="text-transform: none; font-weight: 700; text-align: center; font-size: 15px;">Deudor/Proveedor</th>
                                            <th style="text-transform: none; font-weight: 700; text-align: center; font-size: 15px;">Saldo</th>
                                            <th style="text-transform: none; font-weight: 700; text-align: center; font-size: 15px;">Estado</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr ng-repeat="prove in arrayProveedores| filter: filtroBusquedaSaldos">
                                            <td style="text-align: left">{{prove.nombre|uppercase}}</td>
                                            <td style="text-align: right">
                                                <input style="text-align: right" ng-model="prove.cantidad" type="text" class="form-control input-sm" />
                                            </td>
                                            <td>
                                                <select class="form-control input-sm" ng-model="prove.idEstado" ng-options="mb.idEstado as mb.estado for mb  in estados">
                                                    <option value="">Estado</option>
                                                </select>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <br>
                            <div class="row">
                                <div class="col-lg-4 pull-right">
                                    <button ng-click="guardarSaldos()">Guardar</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
</section>
<div growl></div>
