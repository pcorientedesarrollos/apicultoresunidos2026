<section class="content">
    <div class="row">
        <div class="col-lg-8 col-lg-offset-2">
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px;">
                    <h5 class="encabezadosTabla">
                        GASTOS REALIZADOS POR PROVEEDOR
                        <a title="Regresar" href="#/gastosRealizados" class="btn btn-success btn-xs" style="float: right">
                            <i class="zmdi zmdi-arrow-left"></i>
                        </a>
                    </h5>
                </div>
                <div class="box-body">
                    <br>
                    <h4 class="text-center">{{nombreProveedor}}</h4>
                    <hr>
                    <div class="table-responsive no-padding">
                        <table class="table table-striped table-responsive">
                            <thead>
                                <tr>
                                    <th style="text-transform: none; font-weight: 600">N°</th>
                                    <th style="text-transform: none; font-weight: 600">Concepto</th>
                                    <th style="text-transform: none; font-weight: 600">Fecha</th>
                                    <th style="text-transform: none; font-weight: 600; text-align: right">Cantidad</th>
                                    <th style="text-transform: none; font-weight: 600; text-align: center">Editar</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="gasto in gastosDetalle">
                                    <td>{{$index +1}}</td>
                                    <td>{{gasto.concepto}}</td>
                                    <td>{{gasto.fecha | date:'dd-MM-yyyy'}}</td>
                                    <td style="text-align: right">{{gasto.cantidad}}</td>
                                    <td style="text-align: center">
                                        <a class="btn btn-warning btn-xs" ng-href="#/nvoGasto/{{gasto.idGasto}}" title="Editar">
                                            <i class="zmdi zmdi-edit"></i>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
