<section class="content">
    <div class="row">
        <div class="col-xs-12 col-md-10 col-md-offset-1">
            <div class="box box-solid box-warning">
                <div class="box-header">
                    <h5 class="encabezadosTabla">
                      {{tituloPlantilla}}
                    </h5>
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="form-group">
                                <div class="col-md-6">
                                    <label style="margin-top: 5px" class="radio radio-inline m-r-20">
                                        <input type="radio" value="1" ng-model="tipoDeMiel">Miel 100% pura de abeja
                                        <i class="input-helper"></i>
                                    </label>
                                </div>
                                <div class="col-md-6">
                                    <label style="margin-top: 5px" class="radio radio-inline m-r-20">
                                        <input type="radio" value="2" ng-model="tipoDeMiel">Miel 100% orgánica
                                        <i class="input-helper"></i>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <br>
                    <div class="row">
                        <!-- Para compradores -->
                        <div class="col-xs-12">

                            <div class="table-responsive" ng-repeat="comprador in metas;">
                                <table class="table table-striped table-condensed">
                                    <thead>
                                        <tr>
                                            <th colspan="2">{{comprador.nombre}}</th>
                                            <th>Tambores</th>
                                            <th>Kilogramos</th>
                                        </tr>
                                        <tr>
                                            <td></td>
                                            <td></td>
                                            <td><b>{{comprador.totalTambores | number}}</b></td>
                                            <td><b>{{comprador.totalMeta | number}}</b></td>
                                        </tr>
                                        <tr ng-repeat="zona in comprador.zonas">
                                            <td>{{zona.zona}}</td>
                                            <td>{{zona.referencia}}</td>
                                            <td>
                                                <input type="number" class="form-control" ng-model="zona.tambores"
                                                    ng-change="cambioMetaTambores(zona.tambores, comprador.idComprador, $index);">
                                            </td>
                                            <td>{{zona.kilogramos | number}}</td>
                                        </tr>
                                    </thead>
                                </table>
                            </div>

                        </div>
                    </div>

                    <div class="row" ng-if="metas">
                        <div class="col-xs-12 col-md-4 col-md-offset-8">
                            <button ng-click="guardarMetas()" type="button" class="btn btn-warning pull-right">
                                Guardar metas de compra
                            </button>
                        </div>
                    </div> <!-- / row totales-->

                </div>
            </div>
        </div>
    </div>
</section>
<div growl></div>
