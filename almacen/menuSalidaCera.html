<section class="content">
    <div class="row">
        <div class="col-lg-8 col-lg-offset-2">
            <div class="row">
                <div class="col-xs-12 col-md-4 col-md-offset-8">
                    <div class="form-group">
                        <div class="input-group">
                            <input type="text" ng-model="filtroBusquedaTambores"
                                class="form-control input-sm pull-right" placeholder="Buscar">
                            <div class="input-group-btn">
                                <button class="btn btn-sm btn-default">
                                    <i class="zmdi zmdi-search"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px;">
                    <h5 class="encabezadosTabla">
                        SALIDAS DE CERA
                        <!-- <a href="#/nuevaSalidaCera/0" class="btn btn-success btn-xs" style="float: right">
                            <i class="zmdi zmdi-plus"></i>Agregar
                        </a> -->
                    </h5>
                </div>
                <div class="box-body">
                    <div class="row">
                        <!-- Fila para las opciones de tipo de miel y el botón de descarga -->
                        <div class="col-xs-12 col-md-3">
                            <div class="form-group">
                                <label class="radio radio-inline m-r-20">
                                    <input type="radio" value="1" ng-model="tipoCera" ng-disabled="cargandoDatos">Cera
                                    convencional
                                </label>
                            </div>
                        </div>
                        <div class="col-xs-12 col-md-3">
                            <div class="form-group">
                                <label class="radio radio-inline m-r-20">
                                    <input type="radio" value="2" ng-model="tipoCera" ng-disabled="cargandoDatos">Cera
                                    orgánica
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-xs-12 col-md-3">
                            <div class="form-group">
                                <select chosen class="form-control" ng-model="mostrarMes"
                                    ng-options="mes.idMes as mes.mes for mes in listaDeMeses"
                                    ng-disabled="cargandoDatos">
                                    <!-- <option value="">Selecciona un mes</option> -->
                                    <option value="">Todo</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div ng-if="listaSalidasCera && !listaSalidasCera.length">
                        No hay registros
                    </div>

                    <div ng-if="listaSalidasCera && listaSalidasCera.length">
                        <div class="table-responsive no-padding">
                            <table class="table table-striped table-condensed">
                                <thead>
                                    <tr>
                                        <th>Folio</th>
                                        <th>Fecha</th>
                                        <th>A nombre de</th>
                                        <th style="text-align: right">Kilos</th>
                                        <th style="text-align: right">Total</th>
                                        <th style="text-align: center">Ver</th>
                                        <th>Eliminar</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="salida in listaSalidasCera | filter:filtroBusquedaTambores">
                                        <td>AL-CER-{{salida.idAlmacen}}</td>
                                        <td ng-bind="salida.fecha | date:'dd-MM-yyyy'"></td>
                                        <td ng-bind="salida.proveedor"></td>
                                        <td style="text-align: right" ng-bind="salida.kg"></td>
                                        <td style="text-align: right" ng-bind="salida.total | currency"></td>
                                        <td style="text-align: center;">
                                            <a type="button" class="btn btn-warning btn-xs" title="Ver salida"
                                                href="#/nuevaSalidaCera/{{salida.idAlmacen}}">
                                                <i class="fa fa-pencil"></i>
                                            </a>
                                        </td>
                                        <td style="text-align: center">
                                            <a type="button" class="btn btn-danger btn-xs" title="Eliminar"
                                                ng-click="eliminarEntrada(salida.idAlmacen)">
                                                <i class="fa fa-trash"></i>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<div growl></div>
