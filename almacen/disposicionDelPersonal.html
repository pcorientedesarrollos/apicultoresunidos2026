<section class="content">
    <div class="row">
        <div class="col-lg-6 col-lg-offset-3">
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px;">
                    <h5 class="encabezadosTabla">
                        DISPOSICION DEL PERSONAL</h5>
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-lg-6">
                            <div class="form-group">
                                <label style="font-weight: bold;"  class="col-sm-2 text-primary">Mes: </label>
                                <div class="col-sm-10">
                                    <select 
                                        chosen
                                        ng-model="nombreDelMes" 
                                        class="form-control" 
                                        ng-options="ns.idMes as ns.mes for ns in losMeses"> 
                                        <option value="">MES</option>   
                                    </select>
                                </div>                          
                            </div>
                        </div>
                        <div class="col-lg-2 col-sm-offset-1">
                            <div class="row" style="text-align: right">
                                <br>
                                <button type="submit" ng-click="crearDisposicion(nombreDelMes);" 
                                        class="btn btn-facebook btn-sm waves-effect">Crear</button>
                            </div>
                        </div>
                    </div>
                    <br><br>
                    <div class="table-responsive no-padding">
                        <table class="table table-striped table-responsive">
                            <thead>
                                <tr>
                                    <th style="text-transform: none; font-weight: 600">Mes</th>
                                    <th style=" text-transform: none; font-weight: 600">Editar</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="dispo in infoDisposiciones">
                                    <td>
                                        {{dispo.mes}}
                                    </td>
                                    <td>
                                        <a class="btn btn-warning btn-xs" ng-href="#/nvaDisposicion/{{dispo.idMes}}" title="Ver más">
                                            <i  class="zmdi zmdi-edit" style="text-align: right;"></i>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<div growl>

</div>
