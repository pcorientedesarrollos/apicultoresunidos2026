<section class="content">
    <div class="row">
        <div class="col-lg-8 col-lg-offset-2">
            <div class="row">
                <div class="col-xs-12 col-md-4 col-md-offset-8">
                    <div class="form-group">
                        <div class="input-group">
                            <input type="text" ng-model="filtroBusquedaTambores" class="form-control input-sm pull-right" placeholder="Buscar">
                            <div class="input-group-btn">
                                <button class="btn btn-sm btn-default">
                                    <i class="zmdi zmdi-search"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px;">
                    <h5 class="encabezadosTabla">
                        SALIDAS DE PRODUCTOS APÍCOLAS
                        <!-- <a href="#/nuevaSalidaApicola/0" class="btn btn-success btn-xs" style="float: right">
                            <i class="zmdi zmdi-plus"></i>Agregar
                        </a> -->
                    </h5>
                </div>
                <div class="box-body">
                    <div>
                        <div class="table-responsive no-padding">
                            <table class="table table-striped table-condensed">
                                <thead>
                                    <tr>
                                        <th>Folio</th>
                                        <th>Fecha</th>
                                        <th>A nombre de</th>
                                        <th>Total</th>
                                        <th>Ver</th>
                                        <th>Eliminar</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="salida in listaSalidasApicola | filter:filtroBusquedaTambores">
                                        <td>AL-PAP-{{salida.idAlmacen}}</td>
                                        <td ng-bind="salida.fecha | date:'dd-MM-yyyy'"></td>
                                        <td ng-bind="salida.proveedor"></td>
                                        <td ng-bind="salida.total | currency"></td>
                                        <td>
                                            <a type="button" class="btn btn-warning btn-xs" title="Ver salida" href="#/nuevaSalidaApicola/{{salida.idAlmacen}}">
                                                <i class="fa fa-pencil"></i>
                                            </a>
                                        </td>
                                        <td>
                                            <a type="button" class="btn btn-danger btn-xs" title="Eliminar registro" ng-click="eliminarRegistro(salida.idAlmacen)">
                                                <i class="fa fa-trash"></i>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<div growl></div>
