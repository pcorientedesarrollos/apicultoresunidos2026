<section class="content">
    <div class="row">
        <div class="col-xs-12 col-md-10 col-md-offset-1">
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px;">
                    <h5 class="encabezadosTabla">
                        SALIDA DE MIEL
                        <a title="Regresar" href="#/otrasSalidas" class="btn btn-success btn-xs pull-right">
                            <i class="zmdi zmdi-arrow-left"></i>
                        </a>
                    </h5>
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-xs-12 col-md-5">
                            <div class="form-group">
                                <label style="font-weight: bold;">A nombre de </label>
                                <select name="selectTipoDePersona" id="selectTipoDePersona" class="form-control"
                                    ng-model="salida.tipoDePersona">
                                    <option value="" disabled>A nombre de</option>
                                    <option value="1">Apicultores y acopiadores</option>
                                    <option value="3">Proveedores</option>
                                    <option value="4">Personal</option>
                                    <option value="6">Clientes</option>
                                    <option value="2">Venta al público</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-xs-12 col-md-5" ng-if="salida.tipoDePersona == 1">
                            <div class="form-group">
                                <label for="">&nbsp;</label>
                                <div class="input-group">
                                    <select chosen ng-model="salida.idPersona" class="form-control"
                                        ng-options="cliente.idProveedor as cliente.nombre for cliente in clientes">
                                        <option value="" disabled>Nombre</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-12 col-md-5" ng-if="salida.tipoDePersona == 3">
                            <div class="form-group">
                                <label for="">&nbsp;</label>
                                <div class="input-group">
                                    <select chosen ng-model="salida.idPersona" class="form-control"
                                        ng-options="proveedor.idProveedorMantto as proveedor.nombreProveedor for proveedor in catalogoTablaProveedoresMantto">
                                        <option value="" disabled>Nombre</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-12 col-md-5" ng-if="salida.tipoDePersona == 4">
                            <div class="form-group">
                                <label for="">&nbsp;</label>
                                <select chosen ng-model="salida.idPersona" class="form-control"
                                    ng-options="client.idPersonalOM as client.nombre for client in lstOMPersonal">
                                    <option value="">Nombre</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-xs-12 col-md-5" ng-if="salida.tipoDePersona == 6">
                            <div class="form-group">
                                <label for="">&nbsp;</label>
                                <div class="input-group">
                                    <select chosen ng-model="salida.idPersona" class="form-control"
                                        ng-options="cliente.idCliente as cliente.nombre for cliente in catalogoTablaClientes">
                                        <option value="" disabled>Nombre</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-12 col-md-1" ng-if="salida.tipoDePersona != 2">
                            <div class="form-group">
                                <label for="">&nbsp;</label>
                                <button type="button" class="btn" style="background-color: gold"
                                    ng-click="abrirModalAltasRapidas();" title="Agregar">
                                    <i class="zmdi zmdi-plus"></i> Nuevo</button>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-xs-12 col-md-4">
                            <div class="form-group">
                                <label for="">&nbsp;</label>
                                <div class="input-group date" data-provide="datepicker">
                                    <div class="input-group-addon">
                                        <i class="fa fa-calendar"></i>
                                    </div>
                                    <input type="text" class="form-control pull-right" placeholder="Fecha de salida"
                                        id="datepicker" ng-model="salida.fecha">
                                </div>
                            </div>
                        </div>
                    </div>
                    <hr>
                    <div class="row">
                        <div class="col-xs-12 col-md-4">
                            <div class="form-group">
                                <label for="">Movimiento</label>
                                <select chosen ng-model="nuevoConcepto.cuenta" class="form-control"
                                    ng-options="tm as tm.cuenta for tm in listaCuentasSeleccionadas"
                                    ng-change="cambioSeleccionCuenta()">
                                    <option disabled="disabled" value="">Tipo</option>
                                </select>
                            </div>
                        </div>

                        <div class="col-xs-12 col-md-4">
                            <div class="form-group">
                                <label for="">Selecciona el catálogo</label>
                                <select ng-model="nuevoConcepto.subcuenta" chosen class="form-control"
                                    ng-options="c as c.subcuenta for c in listaSubcuentasSeleccionadas"
                                    ng-change="obtenerSubsubcuentas(nuevoConcepto.subcuenta.idSubcuenta)">
                                    <option value="" disabled="disabled"> Conceptos </option>
                                </select>
                            </div>
                        </div>

                        <div class="col-xs-12 col-md-4" ng-if="listaSubSubcuentas.length">
                            <div class="form-group">
                                <label for="">Selecciona un subconcepto (Opcional)</label>
                                <select chosen ng-model="nuevoConcepto.producto" class="form-control"
                                    ng-options="ss as ss.subSubcuenta for ss in listaSubSubcuentas"
                                    ng-disabled="!listaSubSubcuentas.length" ng-change="calcularimportePeso()">
                                    <option disabled="disabled" value="">Subsubcuenta</option>
                                </select>
                            </div>
                        </div>

                    </div>


                    <!--  -->

                    <div class="row">
                        <div class="col-xs-12 col-md-4">
                            <div class="form-group">
                                <label for="">Tipo de producto</label>
                                <select chosen class="form-control" ng-model="nuevoConcepto.idTipoDeMiel"
                                    ng-options="tipoDeMiel.idTipoDeMiel as tipoDeMiel.tipoDeMiel for tipoDeMiel in tiposDeMiel">
                                    <option value="">Selecciona una opción</option>
                                </select>
                            </div>
                        </div>
                        <!-- <div class="col-xs-12 col-md-4">
                            <div class="form-group">
                                <label for="">Producto</label>
                                <select chosen class="form-control" ng-model="nuevoConcepto.producto" ng-options="producto as producto.subconceptoCC for producto in productosMiel"
                                    ng-change="calcularimportePeso()">
                                    <option value="">Selecciona una opción</option>
                                </select>
                            </div>
                        </div> -->
                        <div class="col-xs-12 col-md-4">
                            <div class="form-group">
                                <label for="">Concepto</label>
                                <select chosen class="form-control"
                                    ng-options="concepto.idConcepto as concepto.concepto for concepto in conceptosSalida"
                                    ng-model="nuevoConcepto.idConcepto">
                                    <option value="">Selecciona una opción</option>
                                </select>
                            </div>
                        </div>

                        <div class="col-xs-12 col-md-4" ng-if="nuevoConcepto.idConcepto == 3">
                            <div class="form-group">
                                <label for="">Observaciones</label>
                                <textarea class="form-control" name="nuevoConceptoObservaciones"
                                    id="nuevoConceptoObservaciones" rows="1" ng-model="nuevoConcepto.observaciones">
                                </textarea>
                            </div>
                        </div>

                    </div>
                    <div class="row">
                        <div class="col-xs-12 col-md-3">
                            <div class="form-group">
                                <label for="">
                                    Precio
                                    <span ng-show="nuevoConcepto.producto">
                                        ({{nuevoConcepto.producto.nombreUnidad}})
                                    </span>
                                </label>
                                <input type="text" class="form-control" ng-model="nuevoConcepto.producto.precioUnitario"
                                    placeholder="50.00" ng-change="calcularimportePeso()">
                            </div>
                        </div>
                        <div class="col-xs-12 col-md-3">
                            <div class="form-group">
                                <label for="">Cantidad</label>
                                <input type="number" class="form-control" ng-model="nuevoConcepto.cantidad"
                                    placeholder="1" ng-change="calcularimportePeso()">
                            </div>
                        </div>
                        <div class="col-xs-12 col-md-3">
                            <div class="form-group">
                                <label for="">Peso</label>
                                <input type="number" class="form-control" ng-value="nuevoConcepto.kg | number:2"
                                    placeholder="1" disabled>
                            </div>
                        </div>
                        <div class="col-xs-12 col-md-3">
                            <div class="form-group">
                                <label for="">Importe</label>
                                <input type="number" class="form-control" ng-value="nuevoConcepto.importe"
                                    placeholder="50.00">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-xs-12 col-md-3">
                            <div class="checkbox">
                                <label for="checkbox">
                                    <input name="checkbox" id="checkbox" type="checkbox"
                                        ng-model="nuevoConcepto.ocupaTambor">
                                    Se ocupó tambor
                                </label>
                            </div>
                        </div>
                        <div class="col-xs-12 col-md-3" ng-if="nuevoConcepto.ocupaTambor">
                            <div class="form-group">
                                <label for="">Folio</label>
                                <input type="number" class="form-control" ng-model="nuevoConcepto.folioTambor">
                            </div>
                        </div>
                        <div class="col-xs-12 col-md-3">
                            <div class="checkbox">
                                <label>
                                    <input type="checkbox" ng-true-value="'1'" ng-false-value="'0'"
                                        ng-model="nuevoConcepto.cajaChica" ng-init="nuevoConcepto.cajaChica = false">
                                    Mandar a caja chica
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-xs-12">
                            <button type="button" class="btn btn-success btn-sm pull-right"
                                ng-click="agregarConceptoSalida()">
                                Agregar
                            </button>
                        </div>
                    </div>
                    <hr>
                    <div class="table-responsive" ng-if="salida.conceptos.length > 0">
                        <table class="table table-condensed table-striped">
                            <thead>
                                <tr>
                                    <th style="text-align:center"></th>
                                    <th style="text-align:center">Tipo de producto</th>
                                    <th style="text-align:center">Concepto</th>
                                    <th style="text-align:center"></th>
                                    <th style="text-align:center">Peso</th>
                                    <th style="text-align:center">Importe</th>
                                    <th style="text-align:center">Caja chica</th>
                                    <th style="text-align:center"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="concepto in salida.conceptos track by $index">
                                    <td style="text-align:center" ng-bind="$index+1"></td>
                                    <td style="text-align:left" ng-bind="concepto.tipoDeMiel"></td>
                                    <td style="text-align:left" ng-bind="concepto.concepto">
                                    <td style="text-align:left" ng-bind="concepto.observaciones">
                                    </td>
                                    <td style="text-align:center">
                                        <span ng-if="concepto.folioTambor">
                                            Folio {{concepto.folioTambor}}
                                        </span>
                                    </td>
                                    <td style="text-align:right" ng-bind="concepto.kg | number"></td>
                                    <td style="text-align:right" ng-bind="concepto.importe | currency"></td>
                                    <td style="text-align: center;">
                                        <input ng-if="concepto.idOtrasSalidasDetalle > 0" type="checkbox"
                                            ng-true-value="'1'" ng-false-value="'0'" ng-model="concepto.cajaChica"
                                            ng-change="mostrarEnInventario(concepto)">
                                    </td>
                                    <td style="text-align:center">
                                        <button type="button" class="btn btn-danger btn-xs"
                                            ng-click="eliminarConcepto($index)">
                                            <i class="fa fa-trash"></i>
                                        </button>
                                    </td>
                                </tr>
                                <tr>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td style="text-align:right" ng-bind="salida.totalPeso | number"></td>
                                    <td style="text-align:right" ng-bind="salida.totalImporte | currency"></td>
                                    <td></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="row" ng-if="salida.conceptos.length > 0">
                        <div class="col-xs-12">
                            <button type="button" class="btn btn-success btn-sm pull-right"
                                ng-click="guardarNuevaSalida()" ng-disabled="guardando_reporte">
                                <span ng-show="!guardando_reporte">Guardar</span>
                                <span ng-show="guardando_reporte">
                                    <i class="fa fa-spinner fa-spin fa-fw"></i> Guardando
                                </span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<div growl></div>
<div class="modal fade" id="modalAltasRapidas" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Alta rápida a catálogos</h4>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-xs-12 col-md-4">
                        <div class="form-group">
                            <select name="seleccionaCatalogo" id="seleccionaCatalogo"
                                ng-model="altaRapida.tipoDePersona" class="form-control">
                                <option value="" disabled> Selecciona catálogo </option>
                                <option value="1">Apicultores y acopiadores</option>
                                <option value="3">Proveedores</option>
                                <option value="4">Personal</option>
                                <option value="6">Clientes</option>
                            </select>
                        </div>
                    </div>
                </div>
                <br>
                <div ng-show="altaRapida.tipoDePersona == 1">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="col-lg-6">
                                <div class="form-group">
                                    <label>Nombre*</label>
                                    <input ng-model="altaRapida.nombre" type="text" class="form-control" />
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="form-group">
                                    <label>Id Sagarpa*</label>
                                    <input type="text" ng-model="altaRapida.idSagarpa" class="form-control" />
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-lg-12">
                            <div class="col-lg-6">
                                <div class="form-group">
                                    <label>Dirección</label>
                                    <input ng-model="altaRapida.direccionCompleta" type="text" class="form-control" />
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="form-group">
                                    <label>Teléfono*</label>
                                    <input ng-model="altaRapida.telefono" type="text" class="form-control" />
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">

                        <div class="col-xs-12">
                            <p><b>Tipo de producto*</b></p>
                        </div>

                        <div class="col-xs-12 col-md-4">
                            <div class="form-group">
                                <label class="radio radio-inline m-r-20">
                                    <input type="radio" value="1" ng-model="altaRapida.tipoDeMiel">Miel 100% pura de
                                    abeja.
                                </label>
                            </div>
                        </div>
                        <div class="col-xs-12 col-md-4">
                            <div class="form-group">
                                <label class="radio radio-inline m-r-20">
                                    <input type="radio" value="2" ng-model="altaRapida.tipoDeMiel">Miel 100% orgánica.
                                </label>
                            </div>
                        </div>
                        <div class="col-xs-12 col-md-4">
                            <div class="form-group">
                                <label class="radio radio-inline m-r-20">
                                    <input type="radio" value="3" ng-model="altaRapida.tipoDeMiel">Ambos.
                                </label>
                            </div>
                        </div>
                    </div>

                </div>
                <div ng-show="altaRapida.tipoDePersona == 3">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="col-lg-6">
                                <div class="form-group">
                                    <label>Nombre:</label>
                                    <input ng-model="altaRapida.nombreProveedor" type="text" class="form-control" />
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="form-group">
                                    <label>Contacto:</label>
                                    <input type="text" ng-model="altaRapida.contactoProveedor" class="form-control" />
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-lg-12">
                            <div class="col-lg-6">
                                <div class="form-group">
                                    <label>Domicilio:</label>
                                    <input ng-model="altaRapida.domicilio" type="text" class="form-control" />
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="form-group">
                                    <label>Teléfono </label>
                                    <input ng-model="altaRapida.telefono" type="text" class="form-control" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div ng-show="altaRapida.tipoDePersona == 4">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="col-lg-6">
                                <div class="form-group">
                                    <label>Área</label>
                                    <select ng-model="altaRapida.idArea" class="form-control"
                                        ng-options="a.idArea as a.area for a in listaAreas">
                                        <option value="">Area</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="form-group">
                                    <label>Clave:</label>
                                    <input type="text" ng-model="altaRapida.clave" class="form-control" />
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="col-lg-6">
                                <div class="form-group">
                                    <label>Nombre:</label>
                                    <input ng-model="altaRapida.nombre" type="text" class="form-control" />
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="form-group">
                                    <label>Puesto: </label>
                                    <select ng-model="altaRapida.idPuesto" class="form-control"
                                        ng-options="p.idPuesto as p.puesto for p in listaPuestos">
                                        <option value="">Puesto</option>
                                    </select>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

                <div ng-show="altaRapida.tipoDePersona == 6">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="col-lg-6">
                                <div class="form-group">
                                    <label>Nombre:</label>
                                    <input ng-model="altaRapida.nombreProveedor" type="text" class="form-control" />
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-lg-12">
                            <div class="col-lg-6">
                                <div class="form-group">
                                    <label>Domicilio:</label>
                                    <input ng-model="altaRapida.domicilio" type="text" class="form-control" />
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="form-group">
                                    <label>Teléfono </label>
                                    <input ng-model="altaRapida.telefono" type="text" class="form-control" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success"
                    ng-click="guardarNuevaAltaRapida(altaRapida);">Guardar</button>
                <button type="button" class="btn btn-danger" data-dismiss="modal">Salir</button>
            </div>
        </div>
    </div>
</div>
