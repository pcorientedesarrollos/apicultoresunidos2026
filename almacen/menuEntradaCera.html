<section class="content">
    <div class="row">
        <div class="col-lg-10 col-lg-offset-1">
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px;">
                    <h5 class="encabezadosTabla">
                        ENTRADAS DE CERA
                        <!-- <a href="#/nuevaEntradaCera/0" class="btn btn-success btn-xs" style="float: right">
                            <i class="zmdi zmdi-plus"></i>Agregar
                        </a> -->
                    </h5>
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-xs-12 col-md-2">
                            <div class="form-group">
                                <select chosen class="form-control" ng-model="mostrarMes"
                                    ng-options="mes.idMes as mes.mes for mes in listaDeMeses"
                                    ng-disabled="cargandoDatos">
                                    <option value="">Todo</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-xs-12 col-md-3">
                            <select chosen class="form-control" ng-model="tipoCera" ng-disabled="cargandoDatos">
                                <option value="" disabled selected>Tipo de cera</option>
                                <option value="1">Cera convencional</option>
                                <option value="2">Cera orgánica</option>
                            </select>
                        </div>
                        <div class="col-xs-12 col-md-3">
                            <div class="form-group">
                                <select chosen class="form-control" ng-model="tipoReporte" ng-disabled="cargandoDatos">
                                    <option value="" selected disabled>Tipo de reporte</option>
                                    <option value="1">Reportes realizados</option>
                                    <option value="2">Reportes no realizados</option>
                                    <option value="0">Realizados y no realizados</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-xs-12 col-md-4">
                            <div class="input-group">
                                <input type="text" ng-model="filtroBusquedaTambores"
                                    class="form-control input-sm pull-right" placeholder="Buscar">
                                <div class="input-group-btn">
                                    <button class="btn btn-sm btn-warning">
                                        <i class="zmdi zmdi-search"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div ng-if="listaEntradasCera && !listaEntradasCera.length">
                        No hay registros
                    </div>

                    <div ng-if="listaEntradasCera && listaEntradasCera.length">
                        <div class="table-responsive no-padding">
                            <table class="table table-striped table-condensed">
                                <thead>
                                    <tr>
                                        <th>Folio</th>
                                        <th>Fecha</th>
                                        <th>Proveedor</th>
                                        <th style="text-align: right;">Kilos totales</th>
                                        <th style="text-align: right;">Total</th>
                                        <th style="text-align: center">Ver</th>
                                        <th>Eliminar</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="entrada in listaEntradasCera | filter:filtroBusquedaTambores">
                                        <td>AL-CER-{{entrada.idAlmacen}}</td>
                                        <td ng-bind="entrada.fecha | date:'dd-MM-yyyy'"></td>
                                        <td ng-bind="entrada.proveedor"></td>
                                        <td style="text-align: right;" ng-bind="entrada.kg"></td>
                                        <td style="text-align: right;" ng-bind="entrada.total | currency"></td>
                                        <td style="text-align: center">
                                            <a type="button" class="btn btn-warning btn-xs" title="Ver entrada"
                                                href="#/nuevaEntradaCera/{{entrada.idAlmacen}}">
                                                <i class="fa fa-pencil"></i>
                                            </a>
                                        </td>
                                        <td style="text-align: center">
                                            <a type="button" class="btn btn-danger btn-xs" title="Eliminar"
                                                ng-click="eliminarEntrada(entrada.idAlmacen)">
                                                <i class="fa fa-trash"></i>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<div growl></div>
