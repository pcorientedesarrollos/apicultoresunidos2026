<section class="content">
    <div class="row">
        <div class="col-xs-12 col-md-4 col-md-offset-6">
            <div class="form-group">
                <div class="">
                    <div class="input-group">
                        <input type="text" ng-model="busquedaAuditorias" class="form-control input-sm pull-right" placeholder="Buscar">
                        <div class="input-group-btn">
                            <button class="btn btn-sm btn-warning">
                                <i class="zmdi zmdi-search"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-xs-12 col-md-8 col-md-offset-2">
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px;">
                    <h5 class="encabezadosTabla">
                        AUDITORÍAS
                        <button title="Agregar auditoría" class="btn btn-success btn-xs pull-right" ng-click="abrirModalNuevaAuditoria()">
                            <i class="fa fa-plus"></i> Nueva
                        </button>
                    </h5>
                </div>
                <div class="box-body table-responsive">
                    <table class="table table-striped table-responsive">
                        <thead>
                            <tr style="height: 35px">
                                <th class="bgm-blue" style="text-transform: none; font-weight: 600"></th>
                                <th class="bgm-blue" style="text-transform: none; font-weight: 600">FECHA</th>
                                <th class="bgm-blue" style="text-transform: none; font-weight: 600">CREADO POR</th>
                                <th class="bgm-blue" style="text-transform: none; font-weight: 600; text-align:center" colspan="2">ESTADO</th>
                                <th class="bgm-blue" style="text-transform: none; font-weight: 600">CAMBIAR ESTADO</th>
                                <th class="bgm-blue" style="text-transform: none; font-weight: 600">VER</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr ng-repeat="auditoria in listaAuditorias| filter:busquedaAuditorias">
                                <td ng-bind="$index + 1"></td>
                                <td ng-bind="auditoria.fecha | date:'dd-MM-yyyy'"></td>
                                <td ng-bind="auditoria.usuario | uppercase"></td>
                                <td style="text-align:center">
                                    <i class="fa fa-circle" ng-if="auditoria.estado == 1 || auditoria.estado == -1 || auditoria.estado == 0" ng-class="{ 'auditoria-verde': auditoria.estado == 1, 'auditoria-rojo': auditoria.estado == -1, '': auditoria.estado == 0}"></i>
                                    <i class="fa fa-check auditoria-verde" ng-if="auditoria.estado == 2"></i>
                                </td>
                                <td>
                                    <select ng-model="auditoria.estado" disabled>
                                        <option value="1">Activo</option>
                                        <option value="-1">Cancelado</option>
                                        <option value="2">Finalizado</option>
                                        <option value="0">Pendiente</option>
                                    </select>
                                </td>
                                <td>
                                    <select ng-model="nuevoEstadoParaAuditoria" ng-hide="auditoria.estado == -1 || auditoria.estado == 2" ng-change="cambiarEstadoDeAuditoria(auditoria, nuevoEstadoParaAuditoria)">
                                        <option value="">Seleccione una opción</option>
                                        <option value="1" ng-if="auditoria.estado == 0">Activar</option>
                                        <option value="-1" ng-if="auditoria.estado == 1 || auditoria.estado == 0">Cancelar</option>
                                        <option value="2" ng-if="auditoria.estado == 1">Finalizar</option>
                                    </select>
                                </td>
                                <td>
                                    <button type="button" class="btn btn-warning btn-xs" ng-click="verAuditoria(auditoria.idAuditoria)">
                                        Detalle
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Modal para crear nuevas auditorías -->

<div class="modal fade" id="modalNuevaAuditoria" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Nueva auditoría</h4>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-xs-12">
                        <div class="form-group">
                            <label>Fecha planeada para la auditoría</label>
                            <div class="input-group date" data-provide="datepicker">
                                <div class="input-group-addon">
                                    <i class="fa fa-calendar"></i>
                                </div>
                                <input type="text" class="form-control pull-right" id="datepicker" placeholder="Fecha" ng-model="nuevaAuditoria.fecha">
                            </div>
                        </div>

                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success" ng-click="guardarNuevaAuditoria()">Guardar</button>
                <button type="button" class="btn btn-danger" data-dismiss="modal">Salir</button>
            </div>
        </div>
    </div>
</div>


<div growl></div>
