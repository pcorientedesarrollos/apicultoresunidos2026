<section class="content">
    <div class="row">
        <div class="col-lg-12">
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px;">
                    <h5 class="encabezadosTabla">
                        COMPARATIVAS EEFF
                    </h5>
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-xs-12 col-md-2">
                            <div class="form-group">
                                <label>&nbsp;</label>
                                <select chosen ng-model="opcionMes" class="form-control"
                                    ng-options="mes.idMes as mes.mes for mes in meses"
                                    ng-disabled="cargandoDatos || opcionTipoReporte == 1">
                                    <option value="" disabled>SELECCIONA MES</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="col-xs-8 col-md-8">
                                <label>&nbsp;</label>
                                <div class="input-group">
                                    <input type="text" ng-model="busquedaComparativa"
                                        class="form-control input-sm pull-right" placeholder="Buscar">
                                    <div class="input-group-btn">
                                        <button class="btn btn-sm btn-warning">
                                            <i class="zmdi zmdi-search"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <!-- <div class="col-xs-4 col-md-4">
                                <div class="form-group col-lg-6">
                                    <br>
                                    <button ng-disabled="cargandoDatos" type="button" ng-click="abrirAcumuladoXls()"
                                        class="btn btn-success btn-sm pull-right">
                                        <i class="fa fa-file-excel-o"></i>
                                    </button>
                                </div>
                                <div class="form-group col-lg-6">
                                    <br>
                                    <button ng-disabled="cargandoDatos" type="button" ng-click="abrirAcumuladoPdf()"
                                        class="btn btn-danger btn-sm pull-right">
                                        <i class="fa fa-file-pdf-o"></i>
                                    </button>
                                </div>
                            </div> -->
                        </div>
                    </div>
                    <br>
                    <div class="box-body">
                        <div class="row">
                            <div class="col-lg-12">
                                <div class="table-responsive no-padding">
                                    <table ng-repeat="compara in comparativa | filter: busquedaComparativa"
                                        class="table table-condensed table-bordered">
                                        <thead>
                                            <tr>
                                                <th colspan="3">{{compara.cuenta}}</th>
                                                <!-- <th></th> -->
                                            </tr>
                                            <tr>
                                                <th>Subcuenta</th>
                                                <th>Presupuesto</th>
                                                <th>Gasto realizado</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr ng-repeat="detalle in compara.subcuentas">
                                                <td>{{detalle.subcuenta}}</td>
                                                <td style="text-align: right; width: 20%;" >{{detalle.cantidad | currency}}</td>
                                                <td style="text-align: right; width: 20%;" >{{detalle.gasto.total | currency}}</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</section>
<div growl></div>
