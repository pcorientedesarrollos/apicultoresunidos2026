<section class="content">
    <div class="row">
        <div class="col-lg-4 col-lg-offset-4">
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px;">
                    <h5 class="encabezadosTabla">
                        Seleccione una Zona
                    </h5>
                </div>
                <div class="box-body table-responsive no-padding">
                    <table class="table table-striped table-responsive">
                        <thead>
                            <tr style="height: 35px">
                                <th class="bgm-blue" style="text-transform: none; font-weight: 600">Zona</th>
                                <th class="bgm-blue" style="text-transform: none; font-weight: 600;text-align: right">Total tambos</th>
                                <th class="bgm-blue" style="text-transform: none; font-weight: 600; text-align: right">Neto total</th>
                                <th class="bgm-blue" style="text-transform: none; font-weight: 600">Ver folios</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr ng-repeat="a in verLasZonas">
                                <td>{{a.zona}}</td>
                                <td style="text-align: right">{{a.total}}</td>
                                <td style="text-align: right">{{a.netoTotal}}</td>
                                <td style="text-align: center">
                                    <a href="#/verFolios/{{a.zona}}" class="btn btn-warning btn-xs" >
                                        <i class="zmdi zmdi-plus"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>
