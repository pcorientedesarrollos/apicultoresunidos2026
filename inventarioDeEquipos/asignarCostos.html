<section class="content">
    <div class="row">
        <div class="box-tools col s4 visible-lg visible-md hidden-sm hidden-xs" style="float: right">
            <div class="input-group" style="width: 300px;">
                <input type="text" 
                       ng-model="filtroBusquedaEquipo" 
                       class="form-control input-sm pull-right" placeholder="Ingrese lo que desea buscar">
                <div class="input-group-btn">
                    <button class="btn btn-sm btn-warning"><i class="zmdi zmdi-search"></i></button>
                </div>
            </div>
        </div>
        <div class="box-tools col-sm-4 col-xs-4 visible-xs visible-sm hidden-md hidden-lg">
            <div class="input-group" style="width: 150px;">
                <input type="text" 
                       ng-model="filtroBusquedaEquipo" name="table_search" class="form-control input-sm pull-right" placeholder="Buscar">
                <div class="input-group-btn">
                    <button class="btn btn-sm btn-default"><i class="zmdi zmdi-search"></i></button>
                </div>
            </div>
        </div>
        <br><br><br>
        <div class="col-lg-12">
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px;">
                    <h5 class="encabezadosTabla">
                        ACTIVOS FIJOS 
                        <a title="Regresar" href="#/equipos" class="btn btn-success btn-xs" style="float: right">
                            <i class="zmdi zmdi-arrow-left"></i> 
                        </a>
                    </h5>
                </div>
                <div class="box-body ">
                    <div class="box-header" style="text-align: center">
                        <h3 style="text-align: center">{{nombreArea}}
                        </h3>
                    </div>
                    <div class="table-responsive no-padding">
                        <table class="table table-striped table-responsive">
                            <thead>
                                <tr style="height: 35px">
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">Código</th>
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">Nombre</th>
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">Marca</th>
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">Modelo</th>
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">N° Serie</th>
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">Descripción</th>
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">Subárea</th>
                                    <th class="bgm-blue" style="text-transform: none; font-weight: 600">Costo</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="mt in menuEquipos| filter:filtroBusquedaEquipo">
                                    <td>AF-MID-{{mt.idEquipo}}</td>
                                    <td>{{mt.nombre}}</td>
                                    <td>{{mt.marca}}</td>
                                    <td>{{mt.modelo}}</td>
                                    <td>{{mt.serie}}</td>
                                    <td  style="height: 40px; overflow: hidden;" class="col-sm-3"><p style="height:40px; overflow:hidden;">{{mt.caracteristicas}}</p></td>
                                    <td>{{mt.zona}}</td>
                                    <td style="text-align: center;">
                                        <label>
                                            <input type="text" 
                                                   class="text-right small"
                                                   required="required"
                                                   ng-model="mt.costo">
                                            <i class="input-helper"></i>    
                                        </label> 
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <center>
                        <br>
                        <button class="btn btn-warning btn-sm"
                                ng-click="guardarCostos()">Guardar</button>
                    </center>
                </div>
            </div>
        </div>
    </div>
</section>
<div growl>

</div>
