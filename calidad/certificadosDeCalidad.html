<section class="content" ng-controller="certificadoCalidadCtrl">
    <div class="row">
        <div class="col-lg-10 col-lg-offset-1">
            <div class="box-tools col s4 visible-lg visible-md hidden-sm hidden-xs" style="float: right">
                <div class="input-group" style="width: 300px;">
                    <input type="text" ng-model="filtroCertificado" class="form-control input-sm pull-right"
                        placeholder="Ingrese lo que desea buscar">
                    <div class="input-group-btn">
                        <button class="btn btn-sm btn-warning">
                            <i class="zmdi zmdi-search"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="box-tools col-sm-4 col-xs-4 visible-xs visible-sm hidden-md hidden-lg">
                <div class="input-group" style="width: 150px;">
                    <input type="text" ng-model="filtroCertificado" name="table_search"
                        class="form-control input-sm pull-right" placeholder="Buscar">
                    <div class="input-group-btn">
                        <button class="btn btn-sm btn-default">
                            <i class="zmdi zmdi-search"></i>
                        </button>
                    </div>
                </div>
            </div>
            <br>
            <br>
            <br>
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px">
                    <h5 class="encabezadosTabla">
                        CERTIFICADOS DE CALIDAD
                    </h5>
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-md-3">
                            <div class="form-group">
                                <select chosen class="form-control" ng-model="mostrarMes"
                                    ng-options="mes.idMes as mes.mes for mes in listaDeMeses"
                                    ng-disabled="cargandoDatos">
                                    <option value="">Todo</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <select ng-disabled="cargandoDatos" chosen class="form-control" ng-model="verTipoDeMiel">
                                <option value="" selected disabled>Opciones</option>
                                <option value="1">Convencional</option>
                                <option value="2">Orgánica</option>
                                <option value="5">Mantequilla</option>
                                <option value="6">Altiplano</option>
                                <option value="7">Naranjo</option>
                                <option value="8">Aguacate</option>
                                <option value="9">Mezquite</option>
                            </select>
                        </div>
                    </div>
                    <br>
                    <div ng-if="informacionLotes && !informacionLotes.length">
                        No hay registros
                    </div>
                    <div ng-if="informacionLotes && informacionLotes.length">
                        <div class="table-responsive no-padding">
                            <table class="table table-striped table-responsive">
                                <thead>
                                    <tr>
                                        <th style="text-transform: none; font-weight: 600">Lote Interno</th>
                                        <th style="text-transform: none; font-weight: 600">Fecha</th>
                                        <th style="text-transform: none; font-weight: 600">Cliente</th>
                                        <th style="text-transform: none; font-weight: 600;">Marcación</th>
                                        <th style="text-transform: none; font-weight: 600"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="lote in informacionLotes| filter:filtroCertificado">
                                        <td ng-show="verTipoDeMiel == 1">LC26-{{lote.idLoteInterno}}</td>
                                        <td ng-show="verTipoDeMiel == 2">LO26-{{lote.idLoteInterno}}</td>
                                        <td>{{lote.fechaCalidad | date:'dd/MM/yyyy'}}</td>
                                        <td>{{lote.cliente|uppercase}}</td>
                                        <td>{{lote.loteCalidad|uppercase}}</td>
                                        <td>
                                            <a class="btn btn-warning btn-xs"
                                                ng-href="#/capturaCertificadoCalidad/{{lote.idLoteInterno}}/{{verTipoDeMiel}}">
                                                <i class="zmdi zmdi-edit"></i>
                                            </a>
                                            <a style="margin-right: 10px;" title="Imprimir PDF"
                                                class="btn btn-danger btn-xs"
                                                ng-click="imprimirCertificadoCalidad(verTipoDeMiel, lote.idLoteInterno)">
                                                <i class="zmdi zmdi-font zmdi-hc-lg"></i>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</section>
<div growl></div>
