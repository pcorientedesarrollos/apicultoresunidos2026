<section class="content">
    <div class="row">
        <div class="col-lg-8 col-md-offset-2">
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px;">
                    <h5 class="encabezadosTabla">
                        FOLIOS DE MIEL SOBRANTE
                    </h5>
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-xs-12 col-md-4">
                            <div class="form-group">
                                <select chosen class="form-control" ng-model="opcionBusqueda.miel">
                                    <option value="" disabled>Selecciona una opción</option>
                                    <option value="1">Miel 100% pura de abeja</option>
                                    <option value="2">Miel 100% orgánica</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <select chosen ng-model="opcionBusqueda.sobrante" class="form-control"
                                ng-options="sobrante.idSobrante as sobrante.nombre for sobrante in listaSobrantes">
                                <option disabled="disabled" value="">Seleccione un tipo de sobrante</option>
                            </select>
                        </div>
                        <div class="col-xs-12 col-sm-1">
                            <div class="form-group">
                                <button type="button" ng-click="buscarReporte(opcionBusqueda);"
                                    class="btn btn-warning btn-xs">Buscar</button>
                            </div>
                        </div>
                        <div ng-if="folios.length > 0" class="col-xs-12 col-sm-1 col-sm-offset-1">
                            <button class="btn btn-success btn-xs"
                                ng-click="xlsDescarga(opcionBusqueda)" title="Descargar XLS">
                                Reporte <i class="fa fa-file-excel-o""></i>
                            </button>
                        </div>
                    </div>
                    <br>
                    <p ng-if="folios.length == 0">No se encuentran datos</p>
                    <br>
                    <div class="table-responsive no-padding" ng-if="folios.length > 0">
                        <table class="table table-striped table-responsive">
                            <thead>
                                <tr>
                                    <th style="text-transform: none; text-align: center;">FOLIO</th>
                                    <th style="text-transform: none; text-align: center;">REFERENCIA</th>
                                    <th style="text-transform: none; text-align: center;">LOTE</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="folio in folios" style="text-align: center">
                                    <td style="width: 20%; font-size: 12px;">
                                        {{folio.folio}}
                                    </td>
                                    <td style="width: 20%; font-size: 12px;">
                                        {{folio.referencia}}
                                    </td>
                                    <td style="width: 20%; font-size: 12px;">
                                        {{folio.lote}}
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<div growl></div>
