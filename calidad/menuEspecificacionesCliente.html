<section class="content">
    <div class="row">
        <div class="col-lg-6 col-lg-offset-3">

            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px;">
                    <h5> ESPECIFICACIONES DEL CLIENTE
                        <b ng-show="opcionCosechaEspecificacion == 1"> MIEL 100% PURA DE ABEJA</b>
                        <b ng-show="opcionCosechaEspecificacion == 2"> MIEL 100% ORGÁNICA</b>
                        <a href="#/nvaEspecificacion/0/0" class="btn btn-success btn-xs" style="float: right">
                            <i class="zmdi zmdi-plus"></i>Agregar
                        </a>
                    </h5>
                </div>

                <div class="box-body">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="form-group">
                                <div class="col-md-6">
                                    <label style="margin-top: 5px" class="radio radio-inline m-r-20">
                                        <input type="radio" value="1" ng-model="opcionCosechaEspecificacion">Miel 100%
                                        pura de abeja
                                        <i class="input-helper"></i>
                                    </label>
                                </div>
                                <div class="col-md-6">
                                    <label style="margin-top: 5px" class="radio radio-inline m-r-20">
                                        <input type="radio" value="2" ng-model="opcionCosechaEspecificacion">Miel 100%
                                        orgánica
                                        <i class="input-helper"></i>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <br>
                    <div class="table-responsive no-padding"></div>
                    <table class="table table-striped table-responsive">
                        <thead>
                            <tr>
                                <th style="text-transform: none; font-weight: 600">Lote</th>
                                <th style="text-align: right; text-transform: none; font-weight: 600">Editar</th>
                            </tr>
                        </thead>
                        <tbody>

                            <tr ng-repeat="especiCli in menuEspecificacion">
                                <td ng-show="opcionCosechaEspecificacion == 1">LC26-{{especiCli.idLoteInterno}}</td>
                                <td ng-show="opcionCosechaEspecificacion == 2">LO26-{{especiCli.idLoteInterno}}</td>
                                <td style="text-align: right">
                                    <a class="btn btn-warning btn-xs"
                                        ng-href="#/nvaEspecificacion/{{especiCli.idLoteInterno}}/{{opcionCosechaEspecificacion}}"
                                        title="Editar">
                                        <i class="zmdi zmdi-edit"></i>
                                    </a>

                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <!--box.warnig-->
        </div>
    </div>
</section>
<div growl>

</div>
