<section class="content">
    <div class="row">
        <div class="col-lg-12">
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px;">
                    <h5 class="encabezadosTabla">
                        SOLICITUDES DE SERVICIOS
                        <a href="#/solicitudServicio/0" class="btn btn-success btn-xs" style="float: right">
                            <i class="zmdi zmdi-plus"></i> Agregar
                        </a>
                    </h5>
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-xs-12 col-md-3">
                            <div class="form-group">
                                <select chosen class="form-control" ng-model="mostrarMes"
                                    ng-options="mes.idMes as mes.mes for mes in listaDeMeses"
                                    ng-disabled="cargandoDatos">
                                    <option value="">Todo</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <select chosen ng-model="area" class="form-control"
                                    ng-options="a.idArea as a.area for a in listaAreas">
                                    <option value="">Todo</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="input-group">
                                <input type="text" ng-model="filtroBusqueda" class="form-control input-sm pull-right"
                                    placeholder="Buscar">
                                <div class="input-group-btn">
                                    <button class="btn btn-sm btn-warning">
                                        <i class="zmdi zmdi-search"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <p ng-if="listaSolicitudes.length == 0">No se encuentran datos</p>
                    <div class="table-responsive no-padding" ng-if="listaSolicitudes.length > 0">
                        <table class="table table-striped table-condensed">
                            <thead>
                                <tr>
                                    <th>Folio</th>
                                    <th>Fecha</th>
                                    <th>Departamento</th>
                                    <th>Solicita</th>
                                    <!-- <th style="text-align: right">Importe total</th> -->
                                    <th style="text-align: right">Aprobado</th>
                                    <th>Ver</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="solicitud in listaSolicitudes | filter:filtroBusqueda">
                                    <td>{{solicitud.idSolicitudServicio}}</td>
                                    <td>{{solicitud.fecha | date: 'dd/MM/yyyy'}}</td>
                                    <td>{{solicitud.departamento}}</td>
                                    <td>{{solicitud.solicita}}</td>
                                    <!-- <td style="text-align: right;">{{solicitud.importeTotal | currency}}</td> -->
                                    <td style="text-align: right;">
                                        {{solicitud.totalAutorizado}}/{{solicitud.totalDetalles}}</td>
                                    <td>
                                        <a type="button" class="btn btn-warning btn-xs" title="Ver solicitud"
                                            href="#/solicitudServicio/{{solicitud.idSolicitudServicio}}">
                                            <i class="fa fa-pencil"></i>
                                        </a>
                                        <button class="btn btn-danger btn-xs" title="Descargar PDF"
                                            ng-click="imprimirSolicitudServicio(solicitud.idSolicitudServicio)">
                                            <i class="fa fa-file-pdf-o"></i>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<div growl></div>
