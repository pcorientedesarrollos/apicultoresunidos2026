<section class="content">
    <div class="row">
        <div class="col-lg-12">
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px;">
                    <h5 class="encabezadosTabla">
                        SOLICITUD DE SERVICIOS
                        <a title="Regresar" href="#/lstSolicitudesServicio" class="btn btn-success btn-xs"
                            style="float: right">
                            <i class="zmdi zmdi-arrow-left"></i>
                        </a>
                    </h5>
                </div>
                <div class="box-body">
                    <!-- <div class="row" ng-if="idEntrada > 0">
                        <div class="col-md-4 col-md-offset-8 pull-right">
                            <div class="col-xs-12 col-md-6">
                                <div class="form-group">
                                    <label style="font-weight: bold;">Folio de entrada:</label>
                                    <b>
                                        <p class="lead text-danger">AL-PDR-{{idEntrada}}</p>
                                    </b>
                                </div>
                            </div>
                            <div class="col-xs-12 col-md-6">
                                <div class="form-group">
                                    <button class="btn btn-danger" title="Imprimir reporte"
                                        ng-click="imprimirReporte()">
                                        <i class="fa fa-file-pdf-o"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div> -->
                    <div class="row">
                        <div class="col-xs-12 col-md-4">
                            <label style="font-weight: bold;">Fecha de solicitud</label>
                            <div class="form-group small">
                                <div class="input-group date" data-provide="datepicker">
                                    <div class="input-group-addon">
                                        <i class="fa fa-calendar"></i>
                                    </div>
                                    <input autocomplete="off" type="text" class="form-control pull-right"
                                        id="datepicker" placeholder="Fecha" ng-model="entrada.fecha">
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-12 col-md-4">
                            <div class="form-group">
                                <label style="font-weight: bold;">Departamento</label>
                                <select chosen ng-model="entrada.departamento" class="form-control"
                                    ng-options="a.idArea as a.area for a in listaAreas">
                                    <option value="" disabled>Nombre</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-xs-12 col-md-4">
                            <div class="form-group">
                                <label style="font-weight: bold;">Solicita:</label>
                                <select chosen ng-model="entrada.solicita" class="form-control"
                                    ng-options="a.idPersonalOM as a.nombre for a in listaPersonal">
                                    <option value="" disabled>Nombre</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <hr>
                    <div class="row">
                        <div class="col-xs-12">
                            <h4>Agrega conceptos</h4>
                        </div>
                    </div>
                    <!-- Nuevas cuentas -->
                    <div class="row">
                        <div class="col-xs-12 col-md-3">
                            <div class="form-group">
                                <label for="">Movimiento</label>
                                <select chosen ng-model="nuevoConcepto.cuenta" class="form-control"
                                    ng-options="tm as tm.cuenta for tm in listaCuentasSeleccionadas"
                                    ng-change="cambioSeleccionCuenta()">
                                    <option disabled="disabled" value="">Tipo</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-xs-12 col-md-3">
                            <div class="form-group">
                                <label for="">Selecciona el catálogo*</label>
                                <select ng-model="nuevoConcepto.subcuentaObj" chosen class="form-control"
                                    ng-options="c as c.subcuenta for c in listaSubcuentasSeleccionadas"
                                    ng-change="obtenerSubsubcuentas(nuevoConcepto.subcuentaObj.idSubcuenta)">
                                    <option value="" disabled="disabled"> Conceptos </option>
                                </select>
                            </div>
                        </div>
                        <div class="col-xs-12 col-md-3" ng-if="listaSubSubcuentas.length">
                            <div class="form-group">
                                <label for="">Selecciona un subconcepto (Opcional)</label>
                                <select chosen ng-model="nuevoConcepto.producto" class="form-control"
                                    ng-options="ss as ss.subSubcuenta for ss in listaSubSubcuentas"
                                    ng-disabled="!listaSubSubcuentas.length" ng-change="calcularimportePeso()">
                                    <option disabled="disabled" value="">Subsubcuenta</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- / Nuevas cuentas -->

                    <div class="row">
                        <div class="col-xs-12 col-md-3">
                            <div class="form-group">
                                <label for="">
                                    Selecciona un equipo
                                </label>
                                <select chosen ng-model="nuevoConcepto.activo" class="form-control"
                                    ng-options="a as a.codigo for a in listaActivos">
                                    <option value="" disabled>Nombre</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-xs-12 col-md-2">
                            <div class="form-group">
                                <label>
                                    Cantidad
                                </label>
                                <input type="number" class="form-control" ng-model="nuevoConcepto.cantidad">
                            </div>
                        </div>
                        <div class="col-xs-12 col-md-7">
                            <div class="form-group">
                                <label>
                                    Descripción
                                </label>
                                <input type="text" class="form-control" ng-model="nuevoConcepto.descripcion">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-xs-12 col-md-12">
                            <div class="form-group">
                                <b>*Características del artículo:</b> {{caracteristicas.caracteristicas}}
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-xs-12 col-md-3">
                            <div class="form-group">
                                <label for="">Proveedor</label>
                                <!-- ng-options="proveedor as proveedor.nombreProveedor for proveedor in catalogoTablaProveedoresMantto" -->
                                <select chosen ng-model="nuevoConcepto.proveedor" class="form-control"
                                    ng-options="p as p.nombreProveedor for p in catalogoTablaProveedoresMantto">
                                    <option value="" disabled>Nombre</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-xs-12 col-md-2">
                            <div class="form-group">
                                <label style="font-weight: bold;">
                                    Costo
                                </label>
                                <input type="number" class="form-control" ng-model="nuevoConcepto.costo">
                            </div>
                        </div>

                        <div class="col-xs-12 col-md-2">
                            <label for="">&nbsp;</label>
                            <div class="form-group">
                                <button class="btn btn-xs btn-success pull-right" ng-click="agregarConceptoServicio()">
                                    Agregar
                                </button>
                            </div>
                        </div>
                    </div>
                    <hr>
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th style="font-size: 11px;">Cantidad</th>
                                    <th style="font-size: 11px;">Movimiento</th>
                                    <th style="font-size: 11px;">Subcuenta</th>
                                    <th style="font-size: 11px;">Subconcepto</th>
                                    <th style="font-size: 11px;">Descripción</th>
                                    <th style="font-size: 11px;">Activo</th>
                                    <th style="font-size: 11px;">Proveedor</th>
                                    <th style="font-size: 11px;">costo</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="concepto in entrada.conceptos">
                                    <td ng-bind="concepto.cantidad | number"></td>
                                    <td ng-bind="concepto.movimiento | uppercase"></td>
                                    <td ng-bind="concepto.subcuenta | uppercase"></td>
                                    <td ng-bind="concepto.concepto | uppercase"></td>
                                    <td ng-bind="concepto.descripcion | uppercase"></td>
                                    <td ng-bind="concepto.activo | uppercase"></td>
                                    <td ng-bind="concepto.proveedor | uppercase"></td>
                                    <td ng-bind="concepto.costo | currency"></td>
                                    <td ng-if="!concepto.idDetalleServicio">
                                        <button type="button" class="btn btn-xs btn-danger"
                                            ng-click="eliminarConcepto($index)">
                                            <i class="fa fa-times"></i>
                                        </button>
                                    </td>
                                    <td ng-if="concepto.idDetalleServicio">
                                        <input ng-if="concepto.idDetalleServicio > 0" type="checkbox"
                                            ng-true-value="'1'" ng-false-value="'0'" ng-model="concepto.estado"
                                            disabled="disabled">
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="row">
                        <div class="col-xs-12">
                            <div class="form-group">
                                <button class="btn btn-warning btn-xs pull-right" ng-click="guardarSolicitudServicio()">
                                    Guardar
                                    solicitud
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<div growl></div>
