<section class="content">
    <div class="row">
        <div class="col-lg-12">
            <div class="box box-solid box-warning">
                <div class="box-header" style="height: 50px;">
                    <h5 class="encabezadosTabla">
                        BUSCADOR DE ARTÍCULOS
                    </h5>
                </div>

                <div class="box-body">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="col-lg-4">
                                <div class="col-lg-6">
                                    <div class="form-group-sm">
                                        <label style="margin-top: 5px" class="radio radio-inline m-r-20">
                                            <input type="radio" 
                                                   value="1" ng-model="opcionDeBuscar.idBusqueda">Un Código
                                            <i class="input-helper"></i> 
                                        </label> 
                                        <input ng-if="opcionDeBuscar.idBusqueda == 1" type="text" 
                                               ng-model="opcionDeBuscar.articuloNo"
                                               placeholder="Código"
                                               ng-keyup="buscarArticulo()"
                                               class="form-control"/>  </div>
                                </div>
                            </div>
                            <div class="col-lg-4">
                                <div class="form-group-sm">
                                    <label style="margin-top: 5px" class="radio radio-inline m-r-20">
                                        <input type="radio" 
                                               value="2" ng-model="opcionDeBuscar.idBusqueda">Rango de Códigos
                                        <i class="input-helper"></i>    
                                    </label> 
                                    <div class="row">
                                        <div class="col-lg-6">
                                            <input ng-if="opcionDeBuscar.idBusqueda == 2" type="text" 
                                                   ng-model="opcionDeBuscar.articulo1"
                                                   placeholder="Código 1"
                                                   class="form-control"/>
                                        </div>
                                        <div class="col-lg-6">
                                            <input ng-if="opcionDeBuscar.idBusqueda == 2" type="text" 
                                                   ng-model="opcionDeBuscar.articulo2"
                                                   placeholder="Código 2"
                                                   ng-keyup="buscarArticulos()"
                                                   class="form-control"/>
                                        </div> 
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-4">
                                <div class="col-lg-6">
                                    <div class="form-group-sm">
                                        <label style="margin-top: 5px" class="radio radio-inline m-r-20">
                                            <input type="radio" 
                                                   value="3" ng-model="opcionDeBuscar.idBusqueda">Artículo
                                            <i class="input-helper"></i> 
                                        </label> 
                                        <input ng-if="opcionDeBuscar.idBusqueda == 3" type="text" 
                                               ng-model="opcionDeBuscar.nombreArticulo"
                                               placeholder="Nombre del artículo"
                                               ng-keyup="buscarArticuloPorNombre()"
                                               class="form-control"/>  </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <br>
                    <div class="table-responsive no-padding ">
                        <table class="table table-striped table-responsive">
                            <thead>
                                <tr>
                                    <th style="text-transform: none">Código</th>
                                    <th style="text-transform: none; ">Nombre</th>
                                    <th style="text-transform: none; width: 35%">Características</th>
                                    <th style="text-transform: none;">Marca</th>
                                    <th style="text-transform: none;">Modelo</th>
                                    <th style="text-transform: none;">Serie</th>
                                    <th style="text-transform: none;">Clasificación</th>
                                    <th style="text-transform: none;">Area y subárea</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="articulo in informacionDeArticulos">
                                    <td>
                                        <label style="color: red; font-size: 12px;">
                                            AF-MID-{{articulo.idEquipo}}
                                        </label>
                                    </td>
                                    <td style="font-size: 12px;">
                                        {{articulo.nombre}}
                                    </td>
                                    <td style=" font-size: 12px;">
                                        {{articulo.caracteristicas}}
                                    </td>
                                    <td style="font-size: 12px;">
                                        {{articulo.marca}}
                                    </td>
                                    <td style=" font-size: 12px;">
                                        {{articulo.modelo}}
                                    </td>
                                    <td style="font-size: 12px;">
                                        {{articulo.serie}}
                                    </td>

                                    <td style="font-size: 12px;">
                                        {{articulo.clasificacion}}
                                    </td>
                                    <td style="font-size: 12px;">
                                        {{articulo.area}}. {{articulo.zona}}
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <br>
                    <button  class="btn btn-danger btn-xs pull-right" 
                             ng-click="eliminarArticulo()">Limpiar busqueda</button>
                </div>
            </div>
        </div>
    </div>
</section>
<div growl>

</div>
